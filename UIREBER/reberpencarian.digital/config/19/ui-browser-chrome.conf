# ReberPencarian Digital - Configuration 19
# Module: ui-browser-chrome
# Description: Browser Chrome UI Theme
# Protocol: reberpencarian.digital

[module]
id = "19"
name = "ui-browser-chrome"
description = "Browser Chrome UI Theme"
active = true
version = "1.0.0"

[core]
selector_true = enabled
root_input = enabled
universal_access = true

[network]
all_protocols = true
all_ports = true
all_hosts = true
all_ips = true

[render]
engine = "ReberCore-TRUE"
output_format = "dynamic"
theme = "white_blue"

[indexing]
auto_detect = true
real_time = true
full_content_scan = true

[capabilities]
text_search = true
image_search = true
video_search = true
film_search = true
document_search = true
binary_search = true
url_detection = true
domain_detection = true
website_rendering = true

[integration]
connect_to_core = true
share_results = true
sync_index = true
