<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konten & Media - AI_MACHINELEARNING.DIGITAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .content-wrapper { margin-top: 70px; padding: 2rem; }
        .system-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .system-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0,102,255,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }
        .system-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,102,255,0.2); }
        .system-icon {
            width: 50px; height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #0047b3, #0066ff);
            color: white;
        }
    </style>
</head>
<body>
    <nav class="brand-navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="../index.html" class="brand-logo">
                <i class="fas fa-brain"></i>
                <span>AI_MACHINELEARNING.DIGITAL</span>
            </a>
            <div class="auth-buttons">
                <a href="../index.html" class="btn-auth btn-login"><i class="fas fa-home me-1"></i> Beranda</a>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="container">
            <h2 class="mb-4"><i class="fas fa-folder me-2"></i>Sistem Digital .digital</h2>
            <p class="text-muted mb-4">Akses semua sistem AI dan machine learning dalam satu tempat</p>
            
            <div class="system-grid" id="systemsGrid">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const systems = [
            { name: "AITepi", path: "AITepi.digital", icon: "fa-network-wired", desc: "Sistem AI Tepi untuk komputasi terdistribusi" },
            { name: "AgenRAG", path: "AgenRAG.digital", icon: "fa-robot", desc: "Agen RAG untuk retrieval-augmented generation" },
            { name: "DesainAplikasi", path: "DesainAplikasi.digital", icon: "fa-paint-brush", desc: "Desain aplikasi berbasis AI" },
            { name: "DesainArsitektur", path: "DesainArsitektur.digital", icon: "fa-building", desc: "Desain arsitektur dengan AI" },
            { name: "DesainFesyen", path: "DesainFesyen.digital", icon: "fa-tshirt", desc: "Desain fesyen generatif" },
            { name: "DesainGrafis", path: "DesainGrafis.digital", icon: "fa-palette", desc: "Desain grafis otomatis" },
            { name: "GenerasiGambar", path: "GenerasiGambar.digital", icon: "fa-image", desc: "Generasi gambar AI" },
            { name: "JaringanBayes", path: "JaringanBayes.digital", icon: "fa-project-diagram", desc: "Jaringan Bayesian untuk inferensi" },
            { name: "JaringanGeneratif", path: "JaringanGeneratif.digital", icon: "fa-brain", desc: "Jaringan generatif adversarial" },
            { name: "JaringanSaraf", path: "JaringanSaraf.digital", icon: "fa-brain", desc: "Jaringan saraf tiruan" },
            { name: "PembelajaranFederasi", path: "PembelajaranFederasi.digital", icon: "fa-users", desc: "Pembelajaran federasi terdesentralisasi" },
            { name: "PenjelasanAI", path: "PenjelasanAI.digital", icon: "fa-lightbulb", desc: "Explainable AI (XAI)" },
            { name: "ProyekAI", path: "ProyekAI.digital", icon: "fa-folder-open", desc: "Manajemen proyek AI" },
            { name: "RantaiBlok", path: "RantaiBlok.digital", icon: "fa-link", desc: "Integrasi blockchain dengan AI" },
            { name: "ReduksiDimensi", path: "ReduksiDimensi.digital", icon: "fa-compress-arrows-alt", desc: "Reduksi dimensi data" },
            { name: "RekayasaFitur", path: "RekayasaFitur.digital", icon: "fa-tools", desc: "Feature engineering otomatis" },
            { name: "AIStudio", path: "ai.digital", icon: "fa-robot", desc: "Studio pengembangan AI" },
            { name: "AIChatReber", path: "aichatreber.digital", icon: "fa-comments", desc: "Chatbot AI conversational" },
            { name: "AutoMind", path: "automind.digital", icon: "fa-cogs", desc: "Automasi proses kognitif" },
            { name: "BotWise", path: "botwise.digital", icon: "fa-robot", desc: "Platform bot cerdas" },
            { name: "DigitalCore", path: "digital.digital", icon: "fa-microchip", desc: "Core sistem digital" },
            { name: "NexChatAI", path: "nexchat-ai.digital", icon: "fa-comment-dots", desc: "Next-gen chat AI" },
            { name: "RAGEngine", path: "rag.digital", icon: "fa-database", desc: "Engine RAG untuk pencarian" }
        ];

        const grid = document.getElementById('systemsGrid');
        grid.innerHTML = systems.map(sys => `
            <div class="system-card" onclick="window.location.href='../${sys.path}/index.html'">
                <div class="system-icon"><i class="fas ${sys.icon}"></i></div>
                <h5>${sys.name}</h5>
                <p class="text-muted small mb-3">${sys.desc}</p>
                <a href="../${sys.path}/index.html" class="btn btn-sm btn-primary">
                    <i class="fas fa-arrow-right me-1"></i> Akses
                </a>
            </div>
        `).join('');
    </script>
</body>
</html>
