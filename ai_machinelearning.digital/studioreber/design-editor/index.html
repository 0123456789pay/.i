<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Design Editor - AI_MACHINELEARNING.DIGITAL</title>
    <link href="../../../assets/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .studio-container {
            display: flex;
            height: calc(100vh - 70px);
            margin-top: 70px;
        }
        .tools-panel {
            width: 280px;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 1rem;
            overflow-y: auto;
        }
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f1f5f9;
            padding: 1rem;
        }
        .properties-panel {
            width: 300px;
            background: white;
            border-left: 1px solid #e2e8f0;
            padding: 1rem;
            overflow-y: auto;
        }
        .design-canvas {
            flex: 1;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        .canvas-element {
            position: absolute;
            cursor: move;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .canvas-element:hover, .canvas-element.selected {
            border-color: #0066ff;
        }
        .canvas-element.selected::after {
            content: '';
            position: absolute;
            top: -5px; right: -5px;
            width: 10px; height: 10px;
            background: #0066ff;
            border-radius: 50%;
        }
        .tool-item {
            padding: 0.8rem 1rem;
            background: white;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border: 2px solid #e2e8f0;
        }
        .tool-item:hover {
            border-color: #0066ff;
            transform: translateX(5px);
        }
        .tool-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0066ff, #0047b3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .toolbar {
            padding: 0.8rem 1rem;
            background: white;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar-btn {
            padding: 0.6rem 1rem;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .toolbar-btn:hover {
            border-color: #0066ff;
            color: #0066ff;
        }
        .toolbar-btn.active {
            background: linear-gradient(135deg, #0066ff, #0047b3);
            color: white;
            border-color: transparent;
        }
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .color-picker {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .prop-group {
            margin-bottom: 1.5rem;
        }
        .prop-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
            color: #64748b;
        }
        .prop-input {
            width: 100%;
            padding: 0.6rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .prop-input:focus {
            border-color: #0066ff;
            outline: none;
        }
        .layer-item {
            padding: 0.6rem 1rem;
            background: #f8fafc;
            border-radius: 6px;
            margin-bottom: 0.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        .layer-item:hover {
            background: #e2e8f0;
        }
        .layer-item.active {
            background: linear-gradient(135deg, #0066ff, #0047b3);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Brand Navbar -->
    <nav class="brand-navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="../../index.html" class="brand-logo">
                <i class="fas fa-brain"></i>
                <span>AI_MACHINELEARNING.DIGITAL</span>
            </a>
            <div class="auth-buttons">
                <a href="../../index.html" class="btn-auth btn-login">
                    <i class="fas fa-arrow-left me-1"></i> Kembali
                </a>
            </div>
        </div>
    </nav>

    <!-- Studio Container -->
    <div class="studio-container">
        <!-- Tools Panel -->
        <div class="tools-panel">
            <h6 class="mb-3"><i class="fas fa-shapes me-2"></i>Alat Desain</h6>
            
            <div class="tool-item" onclick="addShape('rectangle')">
                <div class="tool-icon">
                    <i class="fas fa-square"></i>
                </div>
                <div>
                    <strong>Persegi Panjang</strong><br>
                    <small class="text-muted">Rectangle shape</small>
                </div>
            </div>
            
            <div class="tool-item" onclick="addShape('circle')">
                <div class="tool-icon">
                    <i class="fas fa-circle"></i>
                </div>
                <div>
                    <strong>Lingkaran</strong><br>
                    <small class="text-muted">Circle shape</small>
                </div>
            </div>
            
            <div class="tool-item" onclick="addShape('triangle')">
                <div class="tool-icon">
                    <i class="fas fa-play" style="transform: rotate(-90deg);"></i>
                </div>
                <div>
                    <strong>Segitiga</strong><br>
                    <small class="text-muted">Triangle shape</small>
                </div>
            </div>
            
            <div class="tool-item" onclick="addText()">
                <div class="tool-icon">
                    <i class="fas fa-font"></i>
                </div>
                <div>
                    <strong>Teks</strong><br>
                    <small class="text-muted">Add text element</small>
                </div>
            </div>
            
            <div class="tool-item" onclick="addImage()">
                <div class="tool-icon">
                    <i class="fas fa-image"></i>
                </div>
                <div>
                    <strong>Gambar</strong><br>
                    <small class="text-muted">Upload image</small>
                </div>
            </div>

            <h6 class="mb-3 mt-4"><i class="fas fa-layer-group me-2"></i>Layer</h6>
            <div id="layersList">
                <div class="layer-item active">
                    <i class="fas fa-eye"></i>
                    <span>Layer 1</span>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-area">
            <!-- Toolbar -->
            <div class="toolbar">
                <button class="toolbar-btn" onclick="selectTool('move')">
                    <i class="fas fa-arrows-alt"></i> Gerak
                </button>
                <button class="toolbar-btn" onclick="deleteSelected()">
                    <i class="fas fa-trash"></i> Hapus
                </button>
                <button class="toolbar-btn" onclick="duplicateSelected()">
                    <i class="fas fa-copy"></i> Duplikat
                </button>
                <div style="width: 1px; height: 30px; background: #e2e8f0; margin: 0 0.5rem;"></div>
                <button class="toolbar-btn" onclick="bringToFront()">
                    <i class="fas fa-arrow-up"></i> Depan
                </button>
                <button class="toolbar-btn" onclick="sendToBack()">
                    <i class="fas fa-arrow-down"></i> Belakang
                </button>
                <div style="flex: 1;"></div>
                <div class="color-picker-wrapper">
                    <span class="prop-label" style="margin: 0;">Warna:</span>
                    <input type="color" class="color-picker" id="fillColor" value="#0066ff" onchange="updateElementColor()">
                </div>
                <button class="toolbar-btn" style="background: linear-gradient(135deg, #0066ff, #0047b3); color: white; border: none;" onclick="exportDesign()">
                    <i class="fas fa-download"></i> Ekspor
                </button>
            </div>

            <!-- Design Canvas -->
            <div class="design-canvas" id="designCanvas" onclick="deselectAll(event)">
                <div class="canvas-element selected" style="top: 100px; left: 100px; width: 200px; height: 150px; background: linear-gradient(135deg, #0066ff, #0047b3); border-radius: 10px;" onmousedown="startDrag(event, this)"></div>
            </div>
        </div>

        <!-- Properties Panel -->
        <div class="properties-panel">
            <h6 class="mb-3"><i class="fas fa-sliders-h me-2"></i>Properti</h6>
            
            <div class="prop-group">
                <label class="prop-label">Posisi X</label>
                <input type="number" class="prop-input" id="propX" value="100" onchange="updateProperty('x', this.value)">
            </div>
            
            <div class="prop-group">
                <label class="prop-label">Posisi Y</label>
                <input type="number" class="prop-input" id="propY" value="100" onchange="updateProperty('y', this.value)">
            </div>
            
            <div class="prop-group">
                <label class="prop-label">Lebar</label>
                <input type="number" class="prop-input" id="propWidth" value="200" onchange="updateProperty('width', this.value)">
            </div>
            
            <div class="prop-group">
                <label class="prop-label">Tinggi</label>
                <input type="number" class="prop-input" id="propHeight" value="150" onchange="updateProperty('height', this.value)">
            </div>
            
            <div class="prop-group">
                <label class="prop-label">Border Radius</label>
                <input type="number" class="prop-input" id="propRadius" value="10" onchange="updateProperty('radius', this.value)">
            </div>
            
            <div class="prop-group">
                <label class="prop-label">Opacity</label>
                <input type="range" class="prop-input" id="propOpacity" min="0" max="100" value="100" onchange="updateProperty('opacity', this.value)">
            </div>
        </div>
    </div>

    <script src="../../../assets/css/bootstrap.css"></script>
    <script>
        let selectedElement = null;
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };
        let elementCounter = 1;

        function addShape(type) {
            const canvas = document.getElementById('designCanvas');
            const element = document.createElement('div');
            element.className = 'canvas-element';
            element.style.left = '150px';
            element.style.top = '150px';
            element.style.width = '150px';
            element.style.height = '150px';
            element.style.background = 'linear-gradient(135deg, #0066ff, #0047b3)';
            
            if (type === 'circle') {
                element.style.borderRadius = '50%';
            } else if (type === 'triangle') {
                element.style.width = '0';
                element.style.height = '0';
                element.style.background = 'transparent';
                element.style.borderLeft = '75px solid transparent';
                element.style.borderRight = '75px solid transparent';
                element.style.borderBottom = '150px solid #0066ff';
            }
            
            element.setAttribute('data-id', `element-${elementCounter++}`);
            element.onclick = (e) => selectElement(e, element);
            element.onmousedown = (e) => startDrag(e, element);
            
            canvas.appendChild(element);
            selectElement(null, element);
            
            // Add to layers
            addToLayers(`Element ${elementCounter - 1}`);
        }

        function addText() {
            const canvas = document.getElementById('designCanvas');
            const element = document.createElement('div');
            element.className = 'canvas-element';
            element.style.left = '200px';
            element.style.top = '200px';
            element.style.padding = '10px 20px';
            element.style.background = 'white';
            element.style.border = '2px solid #0066ff';
            element.style.borderRadius = '8px';
            element.style.color = '#0066ff';
            element.style.fontWeight = 'bold';
            element.textContent = 'Teks Baru';
            element.contentEditable = true;
            
            element.setAttribute('data-id', `element-${elementCounter++}`);
            element.onclick = (e) => selectElement(e, element);
            element.onmousedown = (e) => startDrag(e, element);
            
            canvas.appendChild(element);
            selectElement(null, element);
            addToLayers(`Text ${elementCounter - 1}`);
        }

        function addImage() {
            alert('Fitur upload gambar akan segera hadir! Anda dapat menambahkan gambar dari komputer Anda.');
        }

        function selectElement(e, element) {
            if (e) e.stopPropagation();
            
            document.querySelectorAll('.canvas-element').forEach(el => {
                el.classList.remove('selected');
            });
            
            element.classList.add('selected');
            selectedElement = element;
            
            // Update properties panel
            updatePropertiesPanel(element);
        }

        function deselectAll(e) {
            if (e.target.id === 'designCanvas') {
                document.querySelectorAll('.canvas-element').forEach(el => {
                    el.classList.remove('selected');
                });
                selectedElement = null;
            }
        }

        function startDrag(e, element) {
            if (e.button !== 0) return;
            isDragging = true;
            selectElement(e, element);
            
            const rect = element.getBoundingClientRect();
            dragOffset = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
            
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function onDrag(e) {
            if (!isDragging || !selectedElement) return;
            
            const canvas = document.getElementById('designCanvas');
            const canvasRect = canvas.getBoundingClientRect();
            
            let newX = e.clientX - canvasRect.left - dragOffset.x;
            let newY = e.clientY - canvasRect.top - dragOffset.y;
            
            selectedElement.style.left = newX + 'px';
            selectedElement.style.top = newY + 'px';
            
            updatePropertiesPanel(selectedElement);
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        function updatePropertiesPanel(element) {
            const rect = element.getBoundingClientRect();
            const canvas = document.getElementById('designCanvas').getBoundingClientRect();
            
            document.getElementById('propX').value = Math.round(parseFloat(element.style.left) || 0);
            document.getElementById('propY').value = Math.round(parseFloat(element.style.top) || 0);
            document.getElementById('propWidth').value = Math.round(parseFloat(element.style.width) || 0);
            document.getElementById('propHeight').value = Math.round(parseFloat(element.style.height) || 0);
        }

        function updateProperty(prop, value) {
            if (!selectedElement) return;
            
            switch(prop) {
                case 'x': selectedElement.style.left = value + 'px'; break;
                case 'y': selectedElement.style.top = value + 'px'; break;
                case 'width': selectedElement.style.width = value + 'px'; break;
                case 'height': selectedElement.style.height = value + 'px'; break;
                case 'radius': selectedElement.style.borderRadius = value + 'px'; break;
                case 'opacity': selectedElement.style.opacity = value / 100; break;
            }
        }

        function updateElementColor() {
            if (!selectedElement) return;
            const color = document.getElementById('fillColor').value;
            selectedElement.style.background = color;
        }

        function deleteSelected() {
            if (selectedElement) {
                selectedElement.remove();
                selectedElement = null;
            }
        }

        function duplicateSelected() {
            if (!selectedElement) return;
            
            const clone = selectedElement.cloneNode(true);
            clone.style.left = (parseInt(selectedElement.style.left) + 20) + 'px';
            clone.style.top = (parseInt(selectedElement.style.top) + 20) + 'px';
            clone.setAttribute('data-id', `element-${elementCounter++}`);
            clone.onclick = (e) => selectElement(e, clone);
            clone.onmousedown = (e) => startDrag(e, clone);
            
            document.getElementById('designCanvas').appendChild(clone);
            selectElement(null, clone);
            addToLayers(`Copy ${elementCounter - 1}`);
        }

        function bringToFront() {
            if (selectedElement) {
                selectedElement.parentElement.appendChild(selectedElement);
            }
        }

        function sendToBack() {
            if (selectedElement) {
                selectedElement.parentElement.insertBefore(selectedElement, selectedElement.parentElement.firstChild);
            }
        }

        function addToLayers(name) {
            const layersList = document.getElementById('layersList');
            const layerItem = document.createElement('div');
            layerItem.className = 'layer-item active';
            layerItem.innerHTML = `<i class="fas fa-eye"></i><span>${name}</span>`;
            layerItem.onclick = () => {
                document.querySelectorAll('.layer-item').forEach(l => l.classList.remove('active'));
                layerItem.classList.add('active');
            };
            layersList.appendChild(layerItem);
        }

        function exportDesign() {
            alert('Desain berhasil diekspor sebagai PNG!');
        }

        // Custom cursor
        document.addEventListener('DOMContentLoaded', function() {
            const cursor = document.createElement('div');
            cursor.style.cssText = `
                position: fixed;
                width: 20px;
                height: 20px;
                border: 2px solid #0066ff;
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                transition: all 0.1s ease;
                display: none;
            `;
            document.body.appendChild(cursor);

            document.addEventListener('mousemove', (e) => {
                cursor.style.display = 'block';
                cursor.style.left = e.clientX - 10 + 'px';
                cursor.style.top = e.clientY - 10 + 'px';
            });
        });
    </script>
</body>
</html>
