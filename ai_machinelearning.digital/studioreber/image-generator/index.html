<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Image Generator - AI_MACHINELEARNING.DIGITAL</title>

    <style>
        .studio-container { display: flex; height: calc(100vh - 70px); margin-top: 70px; }
        .sidebar { width: 320px; background: #f8fafc; border-right: 1px solid #e2e8f0; padding: 1rem; overflow-y: auto; }
        .main-area { flex: 1; display: flex; flex-direction: column; padding: 1rem; background: #f1f5f9; }
        .prompt-section { background: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .prompt-input { width: 100%; padding: 1rem; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; resize: none; min-height: 100px; }
        .prompt-input:focus { border-color: #0066ff; outline: none; }
        .generate-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, #0066ff, #0047b3); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; transition: all 0.3s; }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 102, 255, 0.3); }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; cursor: pointer; transition: all 0.3s; background: linear-gradient(135deg, #0066ff, #0047b3); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; }
        .gallery-item:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .style-option { padding: 0.8rem; background: white; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.3s; }
        .style-option:hover, .style-option.active { border-color: #0066ff; background: #eff6ff; }
        .settings-group { margin-bottom: 1.5rem; }
        .settings-label { font-weight: 600; margin-bottom: 0.5rem; display: block; color: #64748b; }
        .settings-slider { width: 100%; }
        .loading-spinner { width: 60px; height: 60px; border: 4px solid #e2e8f0; border-top-color: #0066ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 2rem auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-area { flex: 1; background: white; border-radius: 12px; padding: 1rem; display: flex; align-items: center; justify-content: center; min-height: 400px; }
    </style>
</head>
<body>
    <nav class="brand-navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="../../index.html" class="brand-logo"><i class="fas fa-brain"></i><span>AI_MACHINELEARNING.DIGITAL</span></a>
            <a href="../../index.html" class="btn-auth btn-login"><i class="fas fa-arrow-left me-1"></i> Kembali</a>
        </div>
    </nav>
    <div class="studio-container">
        <div class="sidebar">
            <h5 class="mb-3"><i class="fas fa-wand-magic-sparkles me-2"></i>Pengaturan</h5>
            <div class="settings-group">
                <label class="settings-label">Gaya Seni</label>
                <div class="d-grid gap-2">
                    <div class="style-option active" onclick="selectStyle(this, 'realistic')"><i class="fas fa-camera me-2"></i>Realistis</div>
                    <div class="style-option" onclick="selectStyle(this, 'cartoon')"><i class="fas fa-pencil-alt me-2"></i>Kartun</div>
                    <div class="style-option" onclick="selectStyle(this, 'anime')"><i class="fas fa-eye me-2"></i>Anime</div>
                    <div class="style-option" onclick="selectStyle(this, 'abstract')"><i class="fas fa-palette me-2"></i>Abstrak</div>
                </div>
            </div>
            <div class="settings-group">
                <label class="settings-label">Ukuran Gambar</label>
                <select class="form-select" id="imageSize">
                    <option value="512x512">512 x 512 (Square)</option>
                    <option value="768x768">768 x 768 (HD Square)</option>
                    <option value="1024x1024">1024 x 1024 (Ultra HD)</option>
                </select>
            </div>
            <div class="settings-group">
                <label class="settings-label">Creativity Level: <span id="creativityValue">70</span>%</label>
                <input type="range" class="settings-slider" min="0" max="100" value="70" oninput="document.getElementById('creativityValue').textContent = this.value">
            </div>
        </div>
        <div class="main-area">
            <div class="prompt-section">
                <label class="form-label fw-bold"><i class="fas fa-comment-dots me-2"></i>Deskripsi Gambar</label>
                <textarea class="prompt-input" id="promptInput" placeholder="Jelaskan gambar yang ingin Anda buat... Contoh: Seekor kucing lucu berwarna oranye sedang bermain di taman pada sore hari"></textarea>
                <button class="generate-btn" onclick="generateImage()"><i class="fas fa-magic me-2"></i>Generate Gambar</button>
            </div>
            <div class="result-area" id="resultArea">
                <div class="text-center text-muted">
                    <i class="fas fa-image" style="font-size: 4rem; opacity: 0.3;"></i>
                    <p class="mt-3">Hasil generate akan muncul di sini</p>
                </div>
            </div>
            <h6 class="mt-4 mb-3"><i class="fas fa-history me-2"></i>Gambar Terbaru</h6>
            <div class="gallery-grid">
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
                <div class="gallery-item"><i class="fas fa-image"></i></div>
            </div>
        </div>
    </div>
    
    <script>
        function selectStyle(el, style) {
            document.querySelectorAll('.style-option').forEach(o => o.classList.remove('active'));
            el.classList.add('active');
        }
        function generateImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) { alert('Masukkan deskripsi gambar terlebih dahulu!'); return; }
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<div class="loading-spinner"></div><p class="text-center">AI sedang membuat gambar Anda...</p>';
            setTimeout(() => {
                resultArea.innerHTML = '<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #0066ff, #0047b3); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem;"><i class="fas fa-check-circle me-3"></i>Gambar berhasil dibuat!</div>';
            }, 3000);
        }
        document.addEventListener('DOMContentLoaded', function() {
            const cursor = document.createElement('div');
            cursor.style.cssText = `position: fixed; width: 20px; height: 20px; border: 2px solid #0066ff; border-radius: 50%; pointer-events: none; z-index: 9999; transition: all 0.1s ease; display: none;`;
            document.body.appendChild(cursor);
            document.addEventListener('mousemove', (e) => { cursor.style.display = 'block'; cursor.style.left = e.clientX - 10 + 'px'; cursor.style.top = e.clientY - 10 + 'px'; });
        });
    </script>
</body>
</html>
