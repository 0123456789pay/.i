<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Video Maker - AI_MACHINELEARNING.DIGITAL</title>
    <link href="../../../assets/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        .studio-container { display: flex; height: calc(100vh - 70px); margin-top: 70px; }
        .sidebar { width: 300px; background: #f8fafc; border-right: 1px solid #e2e8f0; padding: 1rem; overflow-y: auto; }
        .main-area { flex: 1; display: flex; flex-direction: column; padding: 1rem; background: #f1f5f9; }
        .timeline { height: 200px; background: white; border-radius: 12px; margin-top: 1rem; padding: 1rem; position: relative; }
        .timeline-track { height: 60px; background: #f1f5f9; border-radius: 8px; margin-bottom: 0.5rem; position: relative; overflow: hidden; }
        .timeline-clip { position: absolute; height: 50px; background: linear-gradient(135deg, #0066ff, #0047b3); border-radius: 6px; top: 5px; cursor: move; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8rem; }
        .preview-window { flex: 1; background: black; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; min-height: 300px; }
        .tool-btn { padding: 0.8rem; background: white; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.3s; }
        .tool-btn:hover { border-color: #0066ff; transform: translateY(-2px); }
        .controls-bar { display: flex; gap: 0.5rem; padding: 1rem; background: white; border-radius: 12px; margin-bottom: 1rem; align-items: center; }
        .play-btn { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #0066ff, #0047b3); color: white; border: none; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>
    <nav class="brand-navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a href="../../index.html" class="brand-logo"><i class="fas fa-brain"></i><span>AI_MACHINELEARNING.DIGITAL</span></a>
            <a href="../../index.html" class="btn-auth btn-login"><i class="fas fa-arrow-left me-1"></i> Kembali</a>
        </div>
    </nav>
    <div class="studio-container">
        <div class="sidebar">
            <h5 class="mb-3"><i class="fas fa-film me-2"></i>Media Library</h5>
            <div class="tool-btn mb-2" onclick="addClip('video')"><i class="fas fa-video me-2"></i>Video</div>
            <div class="tool-btn mb-2" onclick="addClip('audio')"><i class="fas fa-music me-2"></i>Audio</div>
            <div class="tool-btn mb-2" onclick="addClip('text')"><i class="fas fa-font me-2"></i>Teks</div>
            <div class="tool-btn mb-2" onclick="addClip('effect')"><i class="fas fa-magic me-2"></i>Effect</div>
            <h6 class="mt-4 mb-2"><i class="fas fa-sliders-h me-2"></i>Properties</h6>
            <input type="range" class="form-range" id="volumeControl" min="0" max="100" value="100">
            <label class="form-label small">Volume</label>
        </div>
        <div class="main-area">
            <div class="controls-bar">
                <button class="play-btn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
                <button class="btn btn-outline-secondary" onclick="stopVideo()"><i class="fas fa-stop me-1"></i>Stop</button>
                <span class="mx-3" id="timeDisplay">00:00 / 00:30</span>
                <div style="flex:1;"></div>
                <button class="btn btn-primary" onclick="exportVideo()"><i class="fas fa-download me-2"></i>Ekspor Video</button>
            </div>
            <div class="preview-window" id="previewWindow">
                <div class="text-center"><i class="fas fa-play-circle" style="font-size: 4rem; opacity: 0.5;"></i><p class="mt-3">Preview Video</p></div>
            </div>
            <div class="timeline">
                <h6 class="mb-2"><i class="fas fa-clock me-2"></i>Timeline</h6>
                <div class="timeline-track" id="track1"><div class="timeline-clip" style="left: 0; width: 150px;"><i class="fas fa-video me-2"></i>Intro.mp4</div></div>
                <div class="timeline-track" id="track2"><div class="timeline-clip" style="left: 160px; width: 200px;"><i class="fas fa-music me-2"></i>Background Music.mp3</div></div>
                <div class="timeline-track" id="track3"></div>
            </div>
        </div>
    </div>
    <script src="../../../assets/css/bootstrap.css"></script>
    <script>
        let isPlaying = false;
        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.querySelector('.play-btn i');
            btn.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
            if(isPlaying) {
                document.getElementById('previewWindow').innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin" style="font-size: 3rem;"></i><p class="mt-3">Memutar...</p></div>';
            }
        }
        function stopVideo() {
            isPlaying = false;
            document.querySelector('.play-btn i').className = 'fas fa-play';
            document.getElementById('previewWindow').innerHTML = '<div class="text-center"><i class="fas fa-play-circle" style="font-size: 4rem; opacity: 0.5;"></i><p class="mt-3">Preview Video</p></div>';
        }
        function addClip(type) {
            alert('Klip ' + type + ' ditambahkan ke timeline!');
        }
        function exportVideo() {
            alert('Video sedang diekspor... Proses akan selesai dalam beberapa saat!');
        }
        document.addEventListener('DOMContentLoaded', function() {
            const cursor = document.createElement('div');
            cursor.style.cssText = `position: fixed; width: 20px; height: 20px; border: 2px solid #0066ff; border-radius: 50%; pointer-events: none; z-index: 9999; transition: all 0.1s ease; display: none;`;
            document.body.appendChild(cursor);
            document.addEventListener('mousemove', (e) => { cursor.style.display = 'block'; cursor.style.left = e.clientX - 10 + 'px'; cursor.style.top = e.clientY - 10 + 'px'; });
        });
    </script>
</body>
</html>
