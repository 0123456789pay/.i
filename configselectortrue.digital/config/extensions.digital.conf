# Selector True Secure - Digital/Media/Pers Extension Config
# Format: EXTENSION|TYPE|HANDLER|REGEX_PATTERN|BINARY_FLAG|FORMULA_ID

# .digital extension config
.digital|media|render_digital|^dig_[a-f0-9]{8}$|0x1A2B3C4D|F_DIG_001
.digital|config|parse_digital|selector\.true\.[0-9]+|0x5E6F7A8B|F_DIG_002
.digital|secure|encrypt_digital|^[A-Z]{4}-[0-9]{4}-SECURE$|0x9C0D1E2F|F_DIG_003

# .media extension config
.media|stream|process_media|^media_(hd|sd|uhd)_[0-9]+$|0x3G4H5I6J|F_MED_001
.media|asset|load_media|asset\.(png|jpg|webp|svg)|0x7K8L9M0N|F_MED_002
.media|codec|decode_media|codec_(h264|h265|av1)_v[0-9]|0x1O2P3Q4R|F_MED_003

# .pers extension config
.pers|identity|validate_pers|^PERS_ID_[A-Z0-9]{16}$|0x5S6T7U8V|F_PER_001
.pers|profile|build_profile|profile\.(json|yaml|xml)|0x9W0X1Y2Z|F_PER_002
.pers|secure|auth_pers|auth_token_[a-f0-9]{32}|0x3A4B5C6D|F_PER_003

# Core activation formulas
# F_DIG_001 = (bin_to_dec(0x1A2B3C4D) * 1.618) mod 256
# F_DIG_002 = sqrt(hex_flag) + regex_match_count
# F_DIG_003 = sha256(binary_flag + extension_name) mod 10000
# F_MED_001 = (stream_quality * bitrate) / latency_threshold
# F_MED_002 = asset_hash XOR media_key
# F_MED_003 = codec_efficiency * resolution_factor
# F_PER_001 = identity_score * trust_level / time_decay
# F_PER_002 = profile_completeness * validation_weight
# F_PER_003 = auth_strength ^ session_duration

# Binary activation flags (hexadecimal)
ACTIVATE_DIGITAL=0xDEADBEEF
ACTIVATE_MEDIA=0xCAFEBABE
ACTIVATE_PERS=0xFEEDFACE
MASTER_KEY=0x1234567890ABCDEF

# Regex validation patterns for browser activation
BROWSER_CHECK=/^(Chrome|Firefox|Safari|Edge)\/[0-9]+\.[0-9]+/
SYMBOL_VALIDATOR=/^[✓✔✕✖★☆●○▲△■□◆◇]+$|
SECURE_MODE=/SECURE_MODE_(ENABLED|DISABLED)/

# Extension handler mappings
HANDLER_DIGITAL=js/digital_handler.js
HANDLER_MEDIA=js/media_processor.js
HANDLER_PERS=js/pers_validator.js
