<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager - AI Chat Reber</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../../digital/digital-system.css">
</head>
<body>
    <div class="file-manager">
        <header>
            <h1>📁 File Manager</h1>
            <p>Kelola semua file dan data chat Anda</p>
        </header>
        
        <div style="margin: 20px 0;">
            <a href="../dashboard/digital.html" class="back-btn" style="display: inline-block; padding: 10px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 8px;">← Kembali ke Dashboard</a>
        </div>
        
        <div class="file-actions">
            <button onclick="refreshFiles()" style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; margin-right: 10px;">🔄 Refresh</button>
            <button onclick="uploadFile()" style="padding: 10px 20px; background: #764ba2; color: white; border: none; border-radius: 8px; cursor: pointer;">📤 Upload</button>
        </div>
        
        <div class="file-grid" id="fileGrid">
            <!-- Files will be loaded dynamically -->
        </div>
    </div>
    
    <script>
        function refreshFiles() {
            const fileGrid = document.getElementById('fileGrid');
            const files = [
                { name: 'chat_data.json', type: 'database', icon: '🗄️' },
                { name: 'backup_2024.json', type: 'backup', icon: '💾' },
                { name: 'export_conversations.txt', type: 'export', icon: '📄' },
                { name: 'settings.json', type: 'config', icon: '⚙️' },
                { name: 'user_preferences.json', type: 'config', icon: '👤' },
                { name: 'conversation_log.txt', type: 'log', icon: '📝' }
            ];
            
            fileGrid.innerHTML = '';
            files.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-icon">${file.icon}</div>
                    <div class="file-name">${file.name}</div>
                    <div class="file-type">${file.type}</div>
                `;
                fileGrid.appendChild(fileItem);
            });
        }
        
        function uploadFile() {
            alert('Fitur upload file akan segera tersedia!');
        }
        
        // Load files on page load
        document.addEventListener('DOMContentLoaded', refreshFiles);
    </script>
    <script src="../../digital/digital-system.js"></script>

    <!-- ============================================ -->
    <!-- KONFIGURASI HALAMAN: Digital -->
    <!-- ============================================ -->
    
    <style>
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --accent-color: #f093fb;
            --border-radius: 12px;
            --transition-speed: 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .feature-card {
            background: rgba(255,255,255,0.95);
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all var(--transition-speed) ease;
            animation: fadeIn 0.5s ease-out;
        }
        .action-button {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white; border: none; padding: 12px 24px;
            border-radius: 25px; cursor: pointer; font-weight: 600;
            margin: 5px; transition: all var(--transition-speed);
        }
        .action-button:hover { transform: scale(1.05); }
        .stat-box { background: white; padding: 20px; border-radius: var(--border-radius); text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: var(--primary-color); }
        .stat-label { color: #6b7280; font-size: 0.9em; }
        .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
    </style>
    
    <div class="config-panel" id="configPanel" style="display:none;">
        <div class="feature-card">
            <h3>Konfigurasi Digital</h3>
            <label>Mode Otomatis:</label><input type="checkbox" id="autoMode" checked>
            <label>Interval:</label>
            <select id="updateInterval">
                <option value="5000">5 detik</option>
                <option value="10000">10 detik</option>
            </select>
            <button class="action-button" onclick="saveConfig()">Simpan</button>
            <button class="action-button" onclick="resetConfig()" style="background:#ef4444;">Reset</button>
        </div>
    </div>
    
    <div class="stats-dashboard" id="statsDashboard">
        <div class="data-grid">
            <div class="stat-box"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Total</div></div>
            <div class="stat-box"><div class="stat-number" id="statActive">0</div><div class="stat-label">Aktif</div></div>
            <div class="stat-box"><div class="stat-number" id="statPending">0</div><div class="stat-label">Tertunda</div></div>
            <div class="stat-box"><div class="stat-number" id="statCompleted">0</div><div class="stat-label">Selesai</div></div>
        </div>
    </div>
    
    <div class="control-panel" id="controlPanel">
        <div class="feature-card">
            <h3>Panel Kontrol</h3>
            <button class="action-button" onclick="refreshData()">Refresh</button>
            <button class="action-button" onclick="exportData()">Export</button>
            <button class="action-button" onclick="toggleAutoUpdate()">Auto Update</button>
            <button class="action-button" onclick="showConfig()">Konfigurasi</button>
        </div>
    </div>
    
    <div class="activity-log" id="activityLog">
        <div class="feature-card">
            <h3>Log Aktivitas</h3>
            <div id="logContainer" style="max-height:200px;overflow-y:auto;"></div>
        </div>
    </div>
    
    <script>
        const AppState = { currentPage: "Digital", isAutoUpdate: true, updateInterval: 10000, config: { theme: "light" } };
        
        document.addEventListener("DOMContentLoaded", function() {
            console.log("[Digital] Aplikasi dimuat");
            loadConfig(); startAutoUpdate(); updateStats();
            logActivity("Aplikasi diinisialisasi");
        });
        
        function loadConfig() {
            var saved = localStorage.getItem("Digital_config");
            if (saved) AppState.config = JSON.parse(saved);
        }
        
        function saveConfig() {
            var config = { autoMode: document.getElementById("autoMode").checked, updateInterval: parseInt(document.getElementById("updateInterval").value) };
            AppState.config = config;
            localStorage.setItem("Digital_config", JSON.stringify(config));
            logActivity("Konfigurasi disimpan");
            alert("Konfigurasi disimpan!");
        }
        
        function resetConfig() { localStorage.removeItem("Digital_config"); location.reload(); }
        
        function showConfig() {
            var panel = document.getElementById("configPanel");
            panel.style.display = panel.style.display === "none" ? "block" : "none";
        }
        
        var autoUpdateTimer = null;
        function startAutoUpdate() {
            if (AppState.isAutoUpdate) {
                autoUpdateTimer = setInterval(function() { refreshData(); }, AppState.updateInterval);
            }
        }
        function stopAutoUpdate() { if (autoUpdateTimer) { clearInterval(autoUpdateTimer); autoUpdateTimer = null; } }
        function toggleAutoUpdate() {
            AppState.isAutoUpdate = !AppState.isAutoUpdate;
            if (AppState.isAutoUpdate) { startAutoUpdate(); logActivity("Auto update ON"); }
            else { stopAutoUpdate(); logActivity("Auto update OFF"); }
        }
        
        function refreshData() {
            console.log("[Digital] Refreshing...");
            updateStats();
            logActivity("Data diperbarui: " + new Date().toLocaleTimeString());
        }
        
        function updateStats() {
            var total = Math.floor(Math.random() * 100) + 10;
            var active = Math.floor(total * 0.6);
            var pending = Math.floor(total * 0.2);
            var completed = total - active - pending;
            document.getElementById("statTotal").textContent = total;
            document.getElementById("statActive").textContent = active;
            document.getElementById("statPending").textContent = pending;
            document.getElementById("statCompleted").textContent = completed;
        }
        
        function exportData() {
            var data = { timestamp: new Date().toISOString(), page: "Digital" };
            var blob = new Blob([JSON.stringify(data)], {type: "application/json"});
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url; a.download = "Digital_export.json"; a.click();
            logActivity("Data diekspor");
        }
        
        function logActivity(msg) {
            var container = document.getElementById("logContainer");
            if (!container) return;
            var entry = document.createElement("div");
            entry.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
            container.insertBefore(entry, container.firstChild);
            while (container.children.length > 50) container.removeChild(container.lastChild);
        }
        
        window.onerror = function(msg, url, line) { logActivity("Error: " + msg); return false; };
        console.log("[Digital] Semua fungsi dimuat");
    </script>

</body>
</html>
