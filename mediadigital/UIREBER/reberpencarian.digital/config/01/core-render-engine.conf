# ReberPencarian Digital - Core Render Engine Configuration
# Protocol: reberpencarian.digital
# Type: Universal Crawler & Renderer

[engine]
name = "ReberCore-TRUE"
version = "1.0.0"
selector_symbol = "TRUE"
root_symbol = "ROOT::INPUT"
render_mode = "universal"
crawler_active = true

[network]
support_all_ip = true
support_all_hosts = true
support_all_protocols = ["http", "https", "ftp", "file", "data", "ws", "wss", "reber"]
support_all_ports = true
port_range = "1-65535"

[indexing]
auto_index = true
detect_domains = true
detect_urls = true
detect_content_types = ["text", "image", "video", "audio", "document", "application", "binary"]
real_time_update = true

[output]
format = "dynamic"
display_mode = "browser_chrome"
theme = "white_blue"
