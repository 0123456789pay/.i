<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Media Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>Media Digital</h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html#home">Beranda</a></li>
                <li><a href="index.html#features">Fitur</a></li>
                <li><a href="index.html#about">Tentang</a></li>
                <li><a href="index.html#contact">Kontak</a></li>
                <!-- Tombol Login - hanya tampil jika belum login -->
                <li><a href="login.html" class="btn-login" id="nav-login-btn">Login</a></li>
                <!-- Tombol Register - hanya tampil jika belum login -->
                <li><a href="register.html" class="btn-register" id="nav-register-btn">Daftar</a></li>
                <!-- Identitas User - hanya tampil jika sudah login -->
                <li id="nav-user-display" class="user-display" style="display: none;"></li>
                <!-- Tombol Logout - hanya tampil jika sudah login -->
                <li><a href="#" class="btn-logout" id="nav-logout-btn" style="display: none;" onclick="handleLogout(); return false;">Logout</a></li>
            </ul>
            <div class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Login</h2>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email Admin</label>
                    <input type="email" id="email" name="email" placeholder="admin@adminroot.innn" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password Anda" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div class="auth-footer">
                <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
                <p><a href="index.html">Kembali ke Beranda</a></p>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
