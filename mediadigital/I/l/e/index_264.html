<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Sistem Manajemen - Media.Digital</title> <style> :root { --primary: #4f46e5; --secondary: #06b6d4; --dark: #0f172a; --light: #f8fafc; } * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #020617, #0f172a, #1e293b); color: var(--light); min-height: 100vh; } .container { max-width: 1400px; margin: 0 auto; padding: 30px; } h1 { font-size: 36px; margin-bottom: 15px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; } .subtitle { color: rgba(255,255,255,0.6); font-size: 18px; margin-bottom: 30px; } .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; } .feature-card { background: rgba(30,41,59,0.5); backdrop-filter: blur(10px); padding: 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; } .feature-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.3); } .feature-icon { font-size: 40px; margin-bottom: 15px; } .feature-title { font-size: 20px; font-weight: 600; margin-bottom: 10px; } .feature-desc { color: rgba(255,255,255,0.6); line-height: 1.6; } .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; } .stat-card { background: rgba(30,41,59,0.5); padding: 20px; border-radius: 12px; text-align: center; } .stat-value { font-size: 32px; font-weight: bold; color: var(--secondary); } .nav-link { display: inline-block; margin-top: 30px; padding: 15px 30px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; text-decoration: none; border-radius: 10px; font-weight: 600; transition: transform 0.3s; } .nav-link:hover { transform: scale(1.05); } </style> </head> <body> <div class="container"> <h1 id="systemTitle">Sistem Manajemen Digital</h1> <p class="subtitle" id="systemSubtitle">Platform terintegrasi untuk manajemen infrastruktur digital</p> <div class="stats"> <div class="stat-card"><div class="stat-value">575</div><div>direktori Aktif</div></div> <div class="stat-card"><div class="stat-value">2,875</div><div>jumlah berkas</div></div> <div class="stat-card"><div class="stat-value">99.9%</div><div>Uptime</div></div> <div class="stat-card"><div class="stat-value">24/7</div><div>Monitoring</div></div> </div> <div class="features" id="featuresGrid"></div> <a href="../index.html" class="nav-link">← Kembali ke papan-bilas Utama</a> </div> <script> const systems = { 'monitoring': { title: '📈 Real-time Monitoring', subtitle: 'Pantau performa sistem, traffic, dan resource dengan dashboard interaktif', features: ['Monitoring Server 24/7', 'Alert Otomatis', 'Analitik Prediktif', 'Custom Dashboard', 'API Integration', 'Historical Data'] }, 'ai-chat': { title: '🤖 AI Chat Assistant', subtitle: 'Asisten cerdas dengan kemampuan natural language processing', features: ['Natural Language Understanding', 'Multi-language Support', 'Context Awareness', 'Integration RAG', 'Auto Response', 'Learning System'] }, 'rag-engine': { title: '🧠 RAG Knowledge Engine', subtitle: 'Retrieval-Augmented Generation untuk pencarian pengetahuan kontekstual', features: ['Vector Database', 'Semantic Search', 'Document Embedding', 'Context Retrieval', 'Multi-source Integration', 'Continuous Learning'] }, 'news-portal': { title: '📰 Portal Berita Digital', subtitle: 'Sistem CMS berita lengkap dengan fitur publishing modern', features: ['Article Management', 'Category & Tags', 'SEO Optimization', 'Multi-author Support', 'Schedule Publishing', 'Analytics Dashboard'] }, 'video-streaming': { title: '🎬 Video Streaming Platform', subtitle: 'Platform streaming video dengan kualitas tinggi dan fitur lengkap', features: ['4K Streaming', 'Live Broadcasting', 'Auto Transcoding', 'CDN Global', 'DVR Function', 'Monetization Tools'] }, 'film-cinema': { title: '🎥 Bioskop Film Digital', subtitle: 'Katalog film lengkap dengan rekomendasi AI', features: ['HD Movie Library', 'Multi-language Subtitle', 'AI Recommendation', 'Watchlist', 'User Reviews', 'Cross-device Sync'] }, 'game-hub': { title: '🎮 Game Hub Central', subtitle: 'Platform gaming dengan library game dan fitur multiplayer', features: ['1000+ Games', 'Cloud Gaming', 'Multiplayer Matchmaking', 'Achievements System', 'Leaderboards', 'Tournament Mode'] }, 'domain-manager': { title: '🌍 Domain Manager', subtitle: 'Kelola domain, DNS, dan SSL certificates dengan mudah', features: ['Domain Registration', 'DNS Management', 'SSL Certificates', 'WHOIS Privacy', 'Auto Renewal', 'Bulk Operations'] }, 'hosting-control': { title: '☁️ Hosting Control Panel', subtitle: 'Panel kontrol hosting lengkap untuk semua kebutuhan', features: ['Shared/VPS/Dedicated', 'Database Manager', 'Email Accounts', 'FTP Access', 'One-click Install', 'Backup System'] }, 'file-manager': { title: '📁 File Manager Pro', subtitle: 'Kelola file dengan fitur advanced dan kolaborasi tim', features: ['Drag & Drop Upload', 'Version Control', 'Team Collaboration', 'Encryption', 'Bulk Operations', 'Cloud Sync'] } }; const path = window.location.pathname; const systemName = path.split('/').filter(Boolean).pop(); const system = systems[systemName] || systems['monitoring']; document.getElementById('systemTitle').textContent = system.title; document.getElementById('systemSubtitle').textContent = system.subtitle; const featuresGrid = document.getElementById('featuresGrid'); system.features.forEach((feature, index) => { const card = document.createElement('div'); card.className = 'feature-card'; card.style.animationDelay = `${index * 0.1}s`; card.innerHTML = `<div class="feature-icon">✨</div><div class="feature-title">${feature}</div><div class="feature-desc">Fitur canggih untuk mendukung operasional sistem digital Anda</div>`; featuresGrid.appendChild(card); }); </script> </body> </html>
