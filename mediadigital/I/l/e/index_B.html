<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLUNIVERS ICONER - Identifier Module</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        h1 { text-align: center; margin-bottom: 30px; }
        .info-box {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        button {
            background: #fff;
            color: #667eea;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #f0f0f0;
        }
        #output {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔖 ALLUNIVERS ICONER - Identifier</h1>
        <div class="info-box">
            <p>Module untuk menghasilkan dan memvalidasi identifier unik bagi komponen iframe dalam sistem ALLUNIVERS ICONER.</p>
        </div>
        <div>
            <button onclick="generateIdentifier()">hasilkan ID</button>
            <button onclick="validateLastID()">sahkan terakhir ID</button>
            <button onclick="clearOutput()">Clear</button>
        </div>
        <div id="output"></div>
    </div>

    <script src="identifier.js"></script>
    <script>
        function generateIdentifier() {
            const id = window.IconerIdentifier.generateId('iframe');
            document.getElementById('output').innerHTML += `<div>Generated: ${id}</div>`;
        }

        function validateLastID() {
            const output = document.getElementById('output');
            const lastId = output.textContent.match(/iconer_[a-z]+_\d+_\d+/g);
            if (lastId && lastId.length > 0) {
                const isValid = window.IconerIdentifier.validateId(lastId[lastId.length - 1]);
                output.innerHTML += `<div>Validation: ${isValid ? '✅ Valid' : '❌ Invalid'}</div>`;
            }
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }
    </script>
</body>
</html>
