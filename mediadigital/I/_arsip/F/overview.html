<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>papan-bilas Overview</title>
    
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="sidebar-logo">📊 papan-bilas</a>
            </div>
            <ul class="menu">
                <li class="menu-item"><a href="overview.html" class="menu-link active">🏠 Overview</a></li>
                <li class="menu-item"><a href="analytics.html" class="menu-link">📈 Analytics</a></li>
                <li class="menu-item"><a href="settings.html" class="menu-link">⚙️ pengaturan</a></li>
                <li class="menu-item"><a href="../auth/login.html" class="menu-link">🔒 masuk</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Overview papan-bilas</h1>
                <button class="btn btn-secondary" onclick="window.location.href='../index.html'">Back to utama</button>
            </div>
            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">jumlah butiran</h3><div class="card-icon">📦</div></div>
                    <div class="card-value" data-animate="1250">0</div>
                    <div class="card-label">Active butiran in sistem</div>
                </div>
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Processing</h3><div class="card-icon">⚙️</div></div>
                    <div class="card-value" data-animate="89">0</div>
                    <div class="card-label">butiran being processed</div>
                </div>
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Completed</h3><div class="card-icon">✅</div></div>
                    <div class="card-value" data-animate="4521">0</div>
                    <div class="card-label">Completed tasks today</div>
                </div>
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Efficiency</h3><div class="card-icon">📊</div></div>
                    <div class="card-value" data-animate="97">0</div>
                    <div class="card-label">sistem efficiency %</div>
                </div>
            </div>
        </main>
    </div>
    
</body>
</html>
