<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Semua File HTML - MediaDigital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 380px;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #16213e;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            background: #0f3460;
            border-bottom: 2px solid #16213e;
        }

        .sidebar-header h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #e94560;
        }

        .stats {
            font-size: 0.85rem;
            color: #a0a0a0;
        }

        .stats span {
            color: #4ecca3;
            font-weight: bold;
        }

        .search-box {
            padding: 15px 20px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            background: #0f3460;
            box-shadow: 0 0 0 2px #e94560;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .file-list::-webkit-scrollbar {
            width: 8px;
        }

        .file-list::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: #0f3460;
            border-radius: 4px;
        }

        .file-list::-webkit-scrollbar-thumb:hover {
            background: #e94560;
        }

        .file-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #16213e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .file-item:hover {
            background: #0f3460;
            transform: translateX(5px);
            border-left-color: #e94560;
        }

        .file-item.active {
            background: #0f3460;
            border-left-color: #4ecca3;
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }

        .file-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-path {
            font-size: 0.75rem;
            color: #a0a0a0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-icon {
            display: inline-block;
            margin-right: 8px;
            color: #4ecca3;
        }

        /* Preview Area Styles */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f5f5;
            overflow: hidden;
        }

        .preview-header {
            padding: 20px;
            background: #fff;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-title {
            font-size: 1.2rem;
            color: #333;
        }

        .preview-title strong {
            color: #667eea;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: #fff;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e94560;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #d63d56;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #fff;
        }

        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 40vh;
                border-right: none;
                border-bottom: 2px solid #16213e;
            }

            .preview-area {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>📁 File HTML</h2>
                <div class="stats">Total: <span id="totalFiles">0</span> file</div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cari file HTML..." autocomplete="off">
            </div>
            <div class="file-list" id="fileList">
                <!-- File items will be loaded here -->
            </div>
        </aside>

        <!-- Preview Area -->
        <main class="preview-area">
            <div class="preview-header">
                <div class="preview-title">
                    Preview: <strong id="currentFile">Belum ada file dipilih</strong>
                </div>
                <div class="preview-actions">
                    <button class="btn btn-primary" id="refreshBtn" disabled>
                        🔄 Refresh
                    </button>
                    <button class="btn btn-secondary" id="openNewBtn" disabled>
                        🚀 Buka Baru
                    </button>
                </div>
            </div>
            <div class="iframe-container" id="iframeContainer">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <p>Pilih file dari sidebar untuk melihat preview</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let htmlFiles = [];
        let currentFileIndex = -1;
        let filteredFiles = [];

        // DOM Elements
        const fileList = document.getElementById('fileList');
        const searchInput = document.getElementById('searchInput');
        const totalFiles = document.getElementById('totalFiles');
        const currentFileEl = document.getElementById('currentFile');
        const iframeContainer = document.getElementById('iframeContainer');
        const refreshBtn = document.getElementById('refreshBtn');
        const openNewBtn = document.getElementById('openNewBtn');

        // Load HTML files data from JSON
        async function loadFilesData() {
            try {
                const response = await fetch('html_data.json');
                if (!response.ok) {
                    throw new Error('Gagal memuat data file');
                }
                htmlFiles = await response.json();
                filteredFiles = [...htmlFiles];
                init();
            } catch (error) {
                console.error('Error loading files:', error);
                fileList.innerHTML = `
                    <div style="padding: 20px; text-align: center; color: #e94560;">
                        <p>❌ Gagal memuat data file HTML</p>
                        <p style="font-size: 0.85rem; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
                totalFiles.textContent = '0';
            }
        }

        // Initialize
        function init() {
            totalFiles.textContent = htmlFiles.length;
            renderFileList(filteredFiles);
            setupEventListeners();
        }

        // Render file list with virtual scrolling approach
        function renderFileList(files) {
            fileList.innerHTML = '';
            
            if (files.length === 0) {
                fileList.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">Tidak ada file ditemukan</div>';
                return;
            }

            // Show first 200 items for performance
            const maxItems = Math.min(files.length, 200);
            const fragment = document.createDocumentFragment();
            
            for (let i = 0; i < maxItems; i++) {
                const file = files[i];
                const item = createFileItem(file, i);
                fragment.appendChild(item);
            }
            
            fileList.appendChild(fragment);

            if (files.length > 200) {
                const moreItem = document.createElement('div');
                moreItem.style.padding = '15px';
                moreItem.style.textAlign = 'center';
                moreItem.style.color = '#666';
                moreItem.style.fontSize = '0.85rem';
                moreItem.style.background = '#1a1a2e';
                moreItem.style.borderRadius = '8px';
                moreItem.style.marginTop = '10px';
                moreItem.textContent = `... dan ${files.length - 200} file lainnya. Gunakan pencarian untuk menemukan file spesifik.`;
                fileList.appendChild(moreItem);
            }
        }

        // Create file item element
        function createFileItem(file, index) {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.dataset.index = index;
            
            item.innerHTML = `
                <div class="file-name">
                    <span class="file-icon">📄</span>${escapeHtml(file.filename)}
                </div>
                <div class="file-path">${escapeHtml(file.rel_path)}</div>
            `;
            
            item.addEventListener('click', () => selectFile(index));
            
            return item;
        }

        // Select file
        function selectFile(index) {
            if (index < 0 || index >= filteredFiles.length) return;
            
            currentFileIndex = index;
            const file = filteredFiles[index];
            
            // Update active state
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.remove('active');
            });
            const activeItem = document.querySelector(`.file-item[data-index="${index}"]`);
            if (activeItem) {
                activeItem.classList.add('active');
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            // Update current file name
            currentFileEl.textContent = file.filename;
            
            // Enable buttons
            refreshBtn.disabled = false;
            openNewBtn.disabled = false;
            
            // Load preview
            loadPreview(file);
        }

        // Load preview in iframe
        function loadPreview(file) {
            iframeContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            `;
            
            // Convert file path to relative URL from preview.html location
            const relativePath = file.rel_path;
            const iframeSrc = relativePath;
            
            setTimeout(() => {
                iframeContainer.innerHTML = `
                    <iframe 
                        class="preview-iframe" 
                        src="${iframeSrc}" 
                        sandbox="allow-scripts allow-same-origin allow-forms"
                        loading="lazy"
                    ></iframe>
                `;
            }, 300);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                
                if (query === '') {
                    filteredFiles = [...htmlFiles];
                } else {
                    filteredFiles = htmlFiles.filter(file => 
                        file.filename.toLowerCase().includes(query) ||
                        file.rel_path.toLowerCase().includes(query)
                    );
                }
                
                renderFileList(filteredFiles);
                currentFileIndex = -1;
                currentFileEl.textContent = 'Belum ada file dipilih';
                refreshBtn.disabled = true;
                openNewBtn.disabled = true;
                iframeContainer.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <p>Pilih file dari sidebar untuk melihat preview</p>
                    </div>
                `;
            });

            // Refresh button
            refreshBtn.addEventListener('click', () => {
                if (currentFileIndex >= 0 && currentFileIndex < filteredFiles.length) {
                    loadPreview(filteredFiles[currentFileIndex]);
                }
            });

            // Open in new tab button
            openNewBtn.addEventListener('click', () => {
                if (currentFileIndex >= 0 && currentFileIndex < filteredFiles.length) {
                    const file = filteredFiles[currentFileIndex];
                    window.open(file.rel_path, '_blank');
                }
            });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load files data on page load
        loadFilesData();
    </script>
</body>
</html>
