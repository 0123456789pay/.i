            background: white;
            border-radius: 15px;
            overflow: hidden;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .iframe-container {
            height: 250px;
            background: #f5f5f5;
            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .iframe-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 0.9rem;
            background: #f9f9f9;
        }

        .card-footer {
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .path {
            font-size: 0.75rem;
            color: #666;
            padding: 5px 15px;
            background: #f9f9f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 50px;

        .load-more {
            text-align: center;
            margin: 30px 0;

            padding: 15px 40px;
            font-size: 1.1rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .load-more button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

                font-size: 1.8rem;
            }

        let displayedCount = 0;
        const batchSize = 50;
        let filteredFiles = [...allFiles];

        function updateStats() {
            document.getElementById('stats').textContent = 
                `Menampilkan ${displayedCount} dari ${allFiles.length} file HTML`;
        }

        function createCard(filePath, index) {
            const fileName = filePath.split('/').pop();
            const relativePath = filePath.replace('/workspace/mediadigital/', '');
            const previewPath = filePath.replace('/workspace/', '/');
            
            return `
                <div class="card" data-path="${relativePath.toLowerCase()}">
                    <div class="card-header" title="${fileName}">📄 ${fileName}</div>
                    <div class="iframe-container">
                        <div class="iframe-placeholder" data-src="${previewPath}" id="iframe-${index}">
                            Klik "Preview" untuk memuat
                        </div>
                    </div>
                    <div class="path" title="${relativePath}">${relativePath}</div>
                    <div class="card-footer">
                        <button class="btn btn-primary" onclick="loadPreview('${previewPath}', 'iframe-${index}')">
                            👁️ Preview
                        </button>
                        <a href="${previewPath}" target="_blank" class="btn btn-secondary">
                            🔗 Buka Baru
                        </a>
                    </div>
                </div>
            `;
        }

        function loadPreview(src, iframeId) {
            const container = document.getElementById(iframeId);
            if (container) {
                container.innerHTML = `<iframe src="${src}" loading="lazy"></iframe>`;
            }
        }

        function renderBatch() {
            const grid = document.getElementById('fileGrid');
            const start = displayedCount;
            const end = Math.min(displayedCount + batchSize, filteredFiles.length);
            
            for (let i = start; i < end; i++) {
                grid.insertAdjacentHTML('beforeend', createCard(filteredFiles[i], i));
            }
            
            displayedCount = end;
            updateStats();
            
            // Hide load more button if all files are displayed
            if (displayedCount >= filteredFiles.length) {
                document.getElementById('loadMoreContainer').style.display = 'none';
            } else {
                document.getElementById('loadMoreContainer').style.display = 'block';
            }
        }

        function loadMore() {
            renderBatch();
        }

        function filterFiles() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredFiles = allFiles.filter(file => 
                file.toLowerCase().includes(searchTerm)
            );
            
            // Reset grid
            document.getElementById('fileGrid').innerHTML = '';
            displayedCount = 0;
            
            // Show load more button again if needed
            if (filteredFiles.length > batchSize) {
                document.getElementById('loadMoreContainer').style.display = 'block';
            }
            
            renderBatch();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderBatch();
        });
    </script>
