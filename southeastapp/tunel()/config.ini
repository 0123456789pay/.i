# Terminal I/O Tunnel Configuration
# Mesin & Sistem Terminal IO

[tunnel]
name = "southeast-terminal-tunnel"
version = "1.0.0"
protocol = "websocket"
port = 8080
host = "0.0.0.0"

[io]
input_buffer_size = 4096
output_buffer_size = 4096
encoding = "utf-8"
line_ending = "\n"
timeout_ms = 30000

[machine]
type = "virtual-terminal"
shell = "/bin/bash"
working_directory = "/workspace"
environment_vars = ["PATH", "HOME", "USER", "TERM"]

[security]
authentication_required = true
encryption_enabled = true
max_connections = 100
session_timeout_minutes = 60

[logging]
level = "INFO"
file = "/var/log/southeastapp/tunnel.log"
max_size_mb = 50
rotate_count = 5
