<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Studio</title>
    
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">🤖 AI Studio</div>
                <h2>Login</h2>
                <p style="color: var(--gray-700);">Masuk ke dashboard Anda</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <p style="text-align: center; margin-top: 20px; color: var(--gray-700);">
                Belum punya akun? <a href="register.html" style="color: var(--primary-blue);">Daftar</a>
            </p>
            <p style="text-align: center; margin-top: 15px;">
                <a href="../index.html" style="color: var(--gray-700); font-size: 14px;">← Kembali ke Dashboard</a>
            </p>
        </div>
    </div>
    
</body>
</html>
