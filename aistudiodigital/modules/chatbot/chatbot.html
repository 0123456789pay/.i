<!-- AI Chatbot Module -->
<div class="chatbot-container">
    <header class="chatbot-header">
        <h1>AI Chatbot</h1>
        <p>Sistem chatbot dengan AI natural language processing</p>
    </header>
    
    <main class="chatbot-content">
        <div class="chatbot-interface">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="avatar"><i class="fas fa-robot"></i></div>
                    <div class="bubble">Halo! Saya AI Assistant. Ada yang bisa saya bantu?</div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Ketik pesan Anda..." />
                <button class="btn-send" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>
    
    <footer class="chatbot-footer">
        <p>Powered by AI Studio Digital</p>
    </footer>
</div>
