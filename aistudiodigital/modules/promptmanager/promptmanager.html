<!-- Prompt Manager Module -->
<div class="prompt-manager">
    <div class="pm-header">
        <h1><i class="fas fa-comment-dots"></i> Prompt Manager</h1>
        <p>Kelola dan organizasi prompt AI Anda dengan efisien</p>
    </div>
    
    <div class="pm-toolbar">
        <button class="btn-pm" onclick="createNewPrompt()">
            <i class="fas fa-plus"></i> New Prompt
        </button>
        <button class="btn-pm" onclick="importPrompts()">
            <i class="fas fa-upload"></i> Import
        </button>
        <button class="btn-pm" onclick="exportPrompts()">
            <i class="fas fa-download"></i> Export
        </button>
        <div class="pm-search">
            <input type="text" placeholder="Search prompts..." id="promptSearch">
        </div>
    </div>
    
    <div class="pm-content">
        <div class="pm-sidebar">
            <div class="pm-category">
                <h3><i class="fas fa-folder"></i> Categories</h3>
                <ul class="category-list">
                    <li class="active" data-cat="all"><i class="fas fa-th-large"></i> All Prompts</li>
                    <li data-cat="coding"><i class="fas fa-code"></i> Coding</li>
                    <li data-cat="writing"><i class="fas fa-pen"></i> Writing</li>
                    <li data-cat="analysis"><i class="fas fa-chart-line"></i> Analysis</li>
                    <li data-cat="creative"><i class="fas fa-lightbulb"></i> Creative</li>
                </ul>
            </div>
            
            <div class="pm-tags">
                <h3><i class="fas fa-tags"></i> Tags</h3>
                <div class="tag-cloud">
                    <span class="tag">python</span>
                    <span class="tag">javascript</span>
                    <span class="tag">debugging</span>
                    <span class="tag">optimization</span>
                </div>
            </div>
        </div>
        
        <div class="prompts-grid" id="promptsGrid">
            <!-- Prompts will be loaded here -->
        </div>
    </div>
    
    <!-- Prompt Editor Modal -->
    <div class="modal-overlay hidden" id="promptModal">
        <div class="modal-dialog large">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Edit Prompt</h3>
                <button class="btn-close" onclick="closePromptModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="promptTitle" placeholder="Enter prompt title">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="promptCategory">
                        <option value="coding">Coding</option>
                        <option value="writing">Writing</option>
                        <option value="analysis">Analysis</option>
                        <option value="creative">Creative</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="promptTags" placeholder="tag1, tag2, tag3">
                </div>
                <div class="form-group">
                    <label>Prompt Template</label>
                    <textarea id="promptContent" rows="10" placeholder="Enter your prompt template here..."></textarea>
                </div>
                <div class="form-group">
                    <label>Variables (JSON format)</label>
                    <textarea id="promptVariables" rows="4" placeholder='{"variable1": "value1", "variable2": "value2"}'></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-action btn-secondary" onclick="closePromptModal()">Cancel</button>
                <button class="btn-action btn-primary" onclick="savePrompt()">
                    <i class="fas fa-save"></i> Save Prompt
                </button>
            </div>
        </div>
    </div>
</div>
