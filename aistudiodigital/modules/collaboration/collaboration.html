<!-- Collaboration Module -->
<div class="module-wrapper" id="collaboration-module">
    <div class="module-header">
        <h2><i class="fas fa-users"></i> Collaboration</h2>
        <div class="module-actions">
            <button class="btn-module" onclick="ModuleActions.refresh('collaboration')"><i class="fas fa-sync"></i></button>
            <button class="btn-module" onclick="ModuleActions.settings('collaboration')"><i class="fas fa-cog"></i></button>
        </div>
    </div>
    <div class="module-body">
        <div class="collab-section">
            <button id="inviteBtn" class="btn-primary">Invite Team</button>
            <button id="shareBtn" class="btn-secondary">Share Project</button>
            <div class="team-list" id="teamList"></div>
        </div>
    </div>
</div>
