<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Control - AI Studio Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            color: #1e3a5f;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #60a5fa 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: white;
            color: #3b82f6;
        }

        .btn-primary:hover {
            background: #eff6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Left Panel - Commit History */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .toolbar {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
        }

        .commit-history {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            flex: 1;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
            overflow-y: auto;
            max-height: calc(100vh - 400px);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e40af;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .commit-item {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-left: 4px solid #3b82f6;
            padding: 1.25rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .commit-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }

        .commit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .commit-hash {
            font-family: 'Courier New', monospace;
            background: #3b82f6;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .commit-date {
            color: #64748b;
            font-size: 0.9rem;
        }

        .commit-message {
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 0.5rem;
        }

        .commit-author {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.9rem;
        }

        .author-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .commit-changes {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .change-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .change-added {
            color: #10b981;
        }

        .change-removed {
            color: #ef4444;
        }

        .change-modified {
            color: #f59e0b;
        }

        /* Right Panel - Branches & Stats */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .branch-list {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
        }

        .branch-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .branch-item:hover {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            transform: translateX(5px);
        }

        .branch-item.active {
            border-left: 4px solid #3b82f6;
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
        }

        .branch-name {
            font-weight: 600;
            color: #1e3a5f;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .branch-status {
            font-size: 0.85rem;
            color: #64748b;
        }

        .stats-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.1);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(30, 64, 175, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(30, 64, 175, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e40af;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #64748b;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #ef4444;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1e3a5f;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Diff Viewer */
        .diff-viewer {
            background: #1e293b;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            margin-top: 1rem;
        }

        .diff-line {
            padding: 0.25rem 0;
        }

        .diff-added {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .diff-removed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .diff-context {
            color: #94a3b8;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(30, 64, 175, 0.2);
            display: none;
            align-items: center;
            gap: 1rem;
            z-index: 3000;
            animation: slideIn 0.3s ease;
        }

        .toast.active {
            display: flex;
        }

        .toast.success {
            border-left: 4px solid #10b981;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast.info {
            border-left: 4px solid #3b82f6;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header-actions {
                flex-wrap: wrap;
                justify-content: center;
            }

            .main-content {
                padding: 1rem;
            }

            .toolbar {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Navigation Links */
        .nav-links {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 1000;
        }

        .nav-link {
            background: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            color: #3b82f6;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            background: #3b82f6;
            color: white;
            transform: translateX(5px);
        }

        @media (max-width: 768px) {
            .nav-links {
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>
                <i class="fas fa-code-branch"></i>
                Version Control System
            </h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="showCommitModal()">
                    <i class="fas fa-plus"></i> New Commit
                </button>
                <button class="btn btn-secondary" onclick="refreshData()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <button class="btn btn-secondary" onclick="navigateTo('dashboard')">
                    <i class="fas fa-home"></i> Dashboard
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel -->
            <div class="left-panel">
                <!-- Toolbar -->
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="showCommitModal()">
                        <i class="fas fa-commit"></i> Commit
                    </button>
                    <button class="btn btn-success" onclick="pushChanges()">
                        <i class="fas fa-arrow-up"></i> Push
                    </button>
                    <button class="btn btn-secondary" onclick="pullChanges()">
                        <i class="fas fa-arrow-down"></i> Pull
                    </button>
                    <button class="btn btn-secondary" onclick="showBranchModal()">
                        <i class="fas fa-code-branch"></i> New Branch
                    </button>
                    <button class="btn btn-secondary" onclick="showDiffViewer()">
                        <i class="fas fa-columns"></i> View Diff
                    </button>
                    <button class="btn btn-danger" onclick="revertChanges()">
                        <i class="fas fa-undo"></i> Revert
                    </button>
                </div>

                <!-- Commit History -->
                <div class="commit-history">
                    <h2 class="section-title">
                        <i class="fas fa-history"></i>
                        Commit History
                    </h2>
                    <div id="commitList">
                        <!-- Commits will be populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <!-- Branch List -->
                <div class="branch-list">
                    <h2 class="section-title">
                        <i class="fas fa-code-branch"></i>
                        Branches
                    </h2>
                    <div id="branchList">
                        <!-- Branches will be populated dynamically -->
                    </div>
                </div>

                <!-- Statistics -->
                <div class="stats-card">
                    <h2 class="section-title">
                        <i class="fas fa-chart-bar"></i>
                        Statistics
                    </h2>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="totalCommits">0</div>
                            <div class="stat-label">Total Commits</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalBranches">0</div>
                            <div class="stat-label">Branches</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="totalFiles">0</div>
                            <div class="stat-label">Files Changed</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="contributors">0</div>
                            <div class="stat-label">Contributors</div>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity -->
                <div class="stats-card">
                    <h2 class="section-title">
                        <i class="fas fa-clock"></i>
                        Recent Activity
                    </h2>
                    <div id="recentActivity">
                        <!-- Activity will be populated dynamically -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="../dashboard/dashboard.html" class="nav-link">
                <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
            <a href="../chatbot/chatbot.html" class="nav-link">
                <i class="fas fa-comments"></i> Chatbot
            </a>
            <a href="../reports/reports.html" class="nav-link">
                <i class="fas fa-chart-line"></i> Reports
            </a>
            <a href="../settings/settings.html" class="nav-link">
                <i class="fas fa-cog"></i> Settings
            </a>
        </div>
    </div>

    <!-- Commit Modal -->
    <div class="modal-overlay" id="commitModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Create New Commit</h3>
                <button class="modal-close" onclick="closeModal('commitModal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Commit Message</label>
                <input type="text" class="form-input" id="commitMessage" placeholder="Enter commit message...">
            </div>
            <div class="form-group">
                <label class="form-label">Description (Optional)</label>
                <textarea class="form-input form-textarea" id="commitDescription" placeholder="Enter detailed description..."></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Select Files to Commit</label>
                <div id="fileSelection">
                    <!-- File checkboxes will be populated dynamically -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('commitModal')">Cancel</button>
                <button class="btn btn-primary" onclick="createCommit()">
                    <i class="fas fa-check"></i> Create Commit
                </button>
            </div>
        </div>
    </div>

    <!-- Branch Modal -->
    <div class="modal-overlay" id="branchModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Create New Branch</h3>
                <button class="modal-close" onclick="closeModal('branchModal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">Branch Name</label>
                <input type="text" class="form-input" id="branchName" placeholder="Enter branch name...">
            </div>
            <div class="form-group">
                <label class="form-label">Create From</label>
                <select class="form-input" id="branchFrom">
                    <option value="main">main</option>
                    <option value="develop">develop</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('branchModal')">Cancel</button>
                <button class="btn btn-primary" onclick="createBranch()">
                    <i class="fas fa-plus"></i> Create Branch
                </button>
            </div>
        </div>
    </div>

    <!-- Diff Viewer Modal -->
    <div class="modal-overlay" id="diffModal">
        <div class="modal" style="max-width: 900px;">
            <div class="modal-header">
                <h3 class="modal-title">File Differences</h3>
                <button class="modal-close" onclick="closeModal('diffModal')">&times;</button>
            </div>
            <div class="diff-viewer" id="diffContent">
                <!-- Diff content will be populated dynamically -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('diffModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-info-circle" id="toastIcon"></i>
        <span id="toastMessage"></span>
    </div>

    <script>
        // Sample Data
        const commits = [
            {
                hash: 'a1b2c3d',
                message: 'Add new AI model integration',
                author: 'John Doe',
                date: '2024-01-15 14:30:00',
                changes: [
                    { type: 'added', file: 'models/new_model.py' },
                    { type: 'modified', file: 'config/settings.json' },
                    { type: 'added', file: 'tests/test_model.py' }
                ]
            },
            {
                hash: 'e4f5g6h',
                message: 'Fix bug in chatbot response handler',
                author: 'Jane Smith',
                date: '2024-01-15 10:15:00',
                changes: [
                    { type: 'modified', file: 'modules/chatbot/handler.js' },
                    { type: 'removed', file: 'modules/chatbot/old_handler.js' }
                ]
            },
            {
                hash: 'i7j8k9l',
                message: 'Update dashboard analytics',
                author: 'Bob Wilson',
                date: '2024-01-14 16:45:00',
                changes: [
                    { type: 'modified', file: 'modules/dashboard/analytics.js' },
                    { type: 'added', file: 'modules/dashboard/charts.js' }
                ]
            },
            {
                hash: 'm0n1o2p',
                message: 'Improve responsive design',
                author: 'Alice Brown',
                date: '2024-01-14 09:20:00',
                changes: [
                    { type: 'modified', file: 'styles/responsive.css' },
                    { type: 'modified', file: 'components/header.html' }
                ]
            },
            {
                hash: 'q3r4s5t',
                message: 'Add user authentication module',
                author: 'Charlie Davis',
                date: '2024-01-13 11:00:00',
                changes: [
                    { type: 'added', file: 'modules/auth/login.js' },
                    { type: 'added', file: 'modules/auth/register.js' },
                    { type: 'added', file: 'modules/auth/middleware.js' }
                ]
            }
        ];

        const branches = [
            { name: 'main', active: true, commits: 125, updated: '2 hours ago' },
            { name: 'develop', active: false, commits: 98, updated: '1 hour ago' },
            { name: 'feature/chatbot-v2', active: false, commits: 23, updated: '30 minutes ago' },
            { name: 'bugfix/login-issue', active: false, commits: 5, updated: '3 hours ago' },
            { name: 'hotfix/security-patch', active: false, commits: 2, updated: '1 day ago' }
        ];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderCommits();
            renderBranches();
            updateStatistics();
            renderRecentActivity();
        });

        // Render Commits
        function renderCommits() {
            const commitList = document.getElementById('commitList');
            commitList.innerHTML = '';

            commits.forEach(commit => {
                const commitElement = document.createElement('div');
                commitElement.className = 'commit-item';
                commitElement.innerHTML = `
                    <div class="commit-header">
                        <span class="commit-hash">${commit.hash}</span>
                        <span class="commit-date">${formatDate(commit.date)}</span>
                    </div>
                    <div class="commit-message">${commit.message}</div>
                    <div class="commit-author">
                        <div class="author-avatar">${getInitials(commit.author)}</div>
                        <span>${commit.author}</span>
                    </div>
                    <div class="commit-changes">
                        ${commit.changes.map(change => `
                            <div class="change-item">
                                <i class="fas fa-${getChangeIcon(change.type)} change-${change.type}"></i>
                                <span class="change-${change.type}">${change.file}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                commitList.appendChild(commitElement);
            });
        }

        // Render Branches
        function renderBranches() {
            const branchList = document.getElementById('branchList');
            branchList.innerHTML = '';

            branches.forEach(branch => {
                const branchElement = document.createElement('div');
                branchElement.className = `branch-item ${branch.active ? 'active' : ''}`;
                branchElement.onclick = () => switchBranch(branch.name);
                branchElement.innerHTML = `
                    <div class="branch-name">
                        <i class="fas fa-code-branch"></i>
                        ${branch.name}
                    </div>
                    <div class="branch-status">
                        ${branch.commits} commits • ${branch.updated}
                    </div>
                `;
                branchList.appendChild(branchElement);
            });
        }

        // Update Statistics
        function updateStatistics() {
            document.getElementById('totalCommits').textContent = commits.length;
            document.getElementById('totalBranches').textContent = branches.length;
            document.getElementById('totalFiles').textContent = commits.reduce((acc, commit) => acc + commit.changes.length, 0);
            document.getElementById('contributors').textContent = new Set(commits.map(c => c.author)).size;
        }

        // Render Recent Activity
        function renderRecentActivity() {
            const activityDiv = document.getElementById('recentActivity');
            const recent = commits.slice(0, 3);
            
            activityDiv.innerHTML = recent.map(commit => `
                <div class="commit-item" style="padding: 0.75rem; margin-bottom: 0.5rem;">
                    <div class="commit-message" style="font-size: 0.9rem;">${commit.message}</div>
                    <div class="commit-date" style="font-size: 0.8rem;">${formatDate(commit.date)}</div>
                </div>
            `).join('');
        }

        // Helper Functions
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase();
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            
            if (hours < 1) return 'Just now';
            if (hours < 24) return `${hours}h ago`;
            return date.toLocaleDateString();
        }

        function getChangeIcon(type) {
            switch(type) {
                case 'added': return 'plus-circle';
                case 'removed': return 'minus-circle';
                case 'modified': return 'edit';
                default: return 'file';
            }
        }

        // Modal Functions
        function showCommitModal() {
            document.getElementById('commitModal').classList.add('active');
            populateFileSelection();
        }

        function showBranchModal() {
            document.getElementById('branchModal').classList.add('active');
        }

        function showDiffViewer() {
            document.getElementById('diffModal').classList.add('active');
            renderDiff();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Populate File Selection
        function populateFileSelection() {
            const files = [
                'modules/chatbot/handler.js',
                'modules/dashboard/analytics.js',
                'config/settings.json',
                'styles/main.css',
                'utils/helpers.py'
            ];

            const fileSelection = document.getElementById('fileSelection');
            fileSelection.innerHTML = files.map(file => `
                <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; cursor: pointer;">
                    <input type="checkbox" value="${file}" checked>
                    <i class="fas fa-file"></i> ${file}
                </label>
            `).join('');
        }

        // Render Diff
        function renderDiff() {
            const diffContent = document.getElementById('diffContent');
            diffContent.innerHTML = `
                <div class="diff-line diff-context">// File: modules/chatbot/handler.js</div>
                <div class="diff-line diff-context">function handleResponse(message) {</div>
                <div class="diff-line diff-removed">-    console.log('Old handler');</div>
                <div class="diff-line diff-added">+    console.log('New improved handler');</div>
                <div class="diff-line diff-added">+    return processAIResponse(message);</div>
                <div class="diff-line diff-context">}</div>
                <div class="diff-line diff-context"></div>
                <div class="diff-line diff-context">// File: config/settings.json</div>
                <div class="diff-line diff-context">{</div>
                <div class="diff-line diff-context">  "apiVersion": "v2",</div>
                <div class="diff-line diff-removed">-  "timeout": 5000,</div>
                <div class="diff-line diff-added">+  "timeout": 10000,</div>
                <div class="diff-line diff-context">  "maxRetries": 3</div>
                <div class="diff-line diff-context">}</div>
            `;
        }

        // Action Functions
        function createCommit() {
            const message = document.getElementById('commitMessage').value;
            if (!message) {
                showToast('Please enter a commit message', 'error');
                return;
            }

            showToast('Commit created successfully!', 'success');
            closeModal('commitModal');
            setTimeout(() => refreshData(), 1000);
        }

        function createBranch() {
            const branchName = document.getElementById('branchName').value;
            if (!branchName) {
                showToast('Please enter a branch name', 'error');
                return;
            }

            showToast(`Branch '${branchName}' created successfully!`, 'success');
            closeModal('branchModal');
            setTimeout(() => refreshData(), 1000);
        }

        function pushChanges() {
            showToast('Pushing changes to remote...', 'info');
            setTimeout(() => {
                showToast('Changes pushed successfully!', 'success');
            }, 2000);
        }

        function pullChanges() {
            showToast('Pulling latest changes...', 'info');
            setTimeout(() => {
                showToast('Latest changes pulled successfully!', 'success');
            }, 2000);
        }

        function revertChanges() {
            if (confirm('Are you sure you want to revert all uncommitted changes?')) {
                showToast('Changes reverted successfully!', 'success');
            }
        }

        function switchBranch(branchName) {
            showToast(`Switched to branch '${branchName}'`, 'info');
            setTimeout(() => refreshData(), 1000);
        }

        function refreshData() {
            showToast('Refreshing data...', 'info');
            setTimeout(() => {
                renderCommits();
                renderBranches();
                updateStatistics();
                renderRecentActivity();
                showToast('Data refreshed successfully!', 'success');
            }, 1000);
        }

        // Toast Notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toast.className = `toast ${type} active`;
            toastMessage.textContent = message;

            switch(type) {
                case 'success':
                    toastIcon.className = 'fas fa-check-circle';
                    break;
                case 'error':
                    toastIcon.className = 'fas fa-exclamation-circle';
                    break;
                default:
                    toastIcon.className = 'fas fa-info-circle';
            }

            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Navigation
        function navigateTo(page) {
            window.location.href = `../${page}/${page}.html`;
        }

        // Close modal on outside click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(modal => {
                    modal.classList.remove('active');
                });
            }
        });
    </script>
</body>
</html>
