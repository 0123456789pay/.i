<!-- Landing Page Builder Module -->
<div class="landingpage-container">
    <header class="landingpage-header">
        <h1>Landing Page Builder</h1>
        <p>Builder landing page drag-and-drop dengan template profesional</p>
    </header>
    
    <main class="landingpage-content">
        <div class="builder-interface">
            <div class="components-panel">
                <h3>Components</h3>
                <div class="component-item" draggable="true" data-type="hero">
                    <i class="fas fa-image"></i> Hero Section
                </div>
                <div class="component-item" draggable="true" data-type="features">
                    <i class="fas fa-star"></i> Features
                </div>
                <div class="component-item" draggable="true" data-type="testimonials">
                    <i class="fas fa-quote-left"></i> Testimonials
                </div>
                <div class="component-item" draggable="true" data-type="cta">
                    <i class="fas fa-bullhorn"></i> CTA
                </div>
                <div class="component-item" draggable="true" data-type="footer">
                    <i class="fas fa-info-circle"></i> Footer
                </div>
            </div>
            
            <div class="canvas-area">
                <div class="canvas-toolbar">
                    <button class="btn-tool" onclick="previewPage()"><i class="fas fa-eye"></i> Preview</button>
                    <button class="btn-tool" onclick="clearCanvas()"><i class="fas fa-trash"></i> Clear</button>
                    <button class="btn-tool" onclick="savePage()"><i class="fas fa-save"></i> Save</button>
                </div>
                <div class="canvas" id="landingCanvas" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <div class="empty-canvas-message">
                        <i class="fas fa-mouse-pointer"></i>
                        <p>Drag components here to build your landing page</p>
                    </div>
                </div>
            </div>
            
            <div class="properties-panel">
                <h3>Properties</h3>
                <div class="property-group">
                    <label>Background Color</label>
                    <input type="color" id="bgColor" value="#6366f1" />
                </div>
                <div class="property-group">
                    <label>Text Color</label>
                    <input type="color" id="textColor" value="#ffffff" />
                </div>
                <div class="property-group">
                    <label>Padding</label>
                    <input type="range" min="0" max="100" value="20" />
                </div>
            </div>
        </div>
    </main>
    
    <footer class="landingpage-footer">
        <p>AI Studio Digital - Landing Page Builder</p>
    </footer>
</div>
