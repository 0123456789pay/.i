<!-- Code Manager Module -->
<div class="module-wrapper" id="codemanager-module">
    <div class="module-header">
        <h2><i class="fas fa-code"></i> Code Manager</h2>
        <div class="module-actions">
            <button class="btn-module" onclick="ModuleActions.refresh('codemanager')"><i class="fas fa-sync"></i></button>
            <button class="btn-module" onclick="ModuleActions.settings('codemanager')"><i class="fas fa-cog"></i></button>
        </div>
    </div>
    <div class="module-body">
        <div class="code-manager-section">
            <div class="toolbar">
                <button id="newFileBtn" class="btn-primary">New File</button>
                <button id="newFolderBtn" class="btn-secondary">New Folder</button>
                <button id="uploadBtn" class="btn-secondary">Upload</button>
                <button id="downloadBtn" class="btn-secondary">Download All</button>
            </div>
            
            <div class="file-explorer">
                <div class="file-tree" id="fileTree">
                    <!-- File tree will be populated dynamically -->
                </div>
            </div>
            
            <div class="code-editor-section">
                <div class="editor-tabs" id="editorTabs">
                    <!-- Tabs will be added dynamically -->
                </div>
                <textarea id="codeEditor" class="code-editor" placeholder="Select a file to edit..."></textarea>
            </div>
            
            <div class="editor-actions">
                <button id="saveBtn" class="btn-primary">Save</button>
                <button id="saveAsBtn" class="btn-secondary">Save As</button>
                <button id="deleteBtn" class="btn-danger">Delete</button>
            </div>
        </div>
        
        <div class="file-info-panel">
            <h3>File Information</h3>
            <div id="fileInfo">
                <p>Name: <span id="fileName">-</span></p>
                <p>Type: <span id="fileType">-</span></p>
                <p>Size: <span id="fileSize">-</span></p>
                <p>Last Modified: <span id="lastModified">-</span></p>
            </div>
        </div>
    </div>
</div>
