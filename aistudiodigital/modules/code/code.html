<!-- Code Module - Pohon Kode AI -->
<div class="module-wrapper" id="code-module">
    <div class="module-header">
        <h2><i class="fas fa-folder-tree"></i> Code - AI Generated Files</h2>
        <div class="module-actions">
            <button class="btn-module" onclick="CodeModule.refresh()"><i class="fas fa-sync"></i></button>
            <button class="btn-module" onclick="CodeModule.newFile()"><i class="fas fa-plus"></i></button>
            <button class="btn-module" onclick="CodeModule.settings()"><i class="fas fa-cog"></i></button>
        </div>
    </div>
    <div class="module-body">
        <div class="code-tree-container">
            <div class="tree-header">
                <span><i class="fas fa-sitemap"></i> Project Structure</span>
                <div class="tree-controls">
                    <button onclick="CodeModule.expandAll()"><i class="fas fa-expand-alt"></i></button>
                    <button onclick="CodeModule.collapseAll()"><i class="fas fa-compress-alt"></i></button>
                </div>
            </div>
            <div class="file-tree" id="codeFileTree">
                <!-- File tree populated dynamically -->
            </div>
        </div>
        
        <div class="code-content-area">
            <div class="content-tabs">
                <button class="tab-btn active" data-tab="editor" onclick="CodeModule.switchTab('editor')">
                    <i class="fas fa-edit"></i> Editor
                </button>
                <button class="tab-btn" data-tab="preview" onclick="CodeModule.switchTab('preview')">
                    <i class="fas fa-eye"></i> Preview
                </button>
                <button class="tab-btn" data-tab="properties" onclick="CodeModule.switchTab('properties')">
                    <i class="fas fa-info-circle"></i> Properties
                </button>
            </div>
            
            <div class="tab-content active" id="editorTab">
                <div class="editor-toolbar">
                    <select id="codeFileType" onchange="CodeModule.changeLanguage()">
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="js">JavaScript</option>
                        <option value="json">JSON</option>
                        <option value="md">Markdown</option>
                    </select>
                    <div class="toolbar-group">
                        <button onclick="CodeModule.formatCode()" title="Format"><i class="fas fa-align-left"></i></button>
                        <button onclick="CodeModule.undo()" title="Undo"><i class="fas fa-undo"></i></button>
                        <button onclick="CodeModule.redo()" title="Redo"><i class="fas fa-redo"></i></button>
                        <button onclick="CodeModule.saveFile()" title="Save"><i class="fas fa-save"></i></button>
                    </div>
                </div>
                <textarea id="codeEditorArea" class="code-editor-area" placeholder="Select a file from the tree to edit..." spellcheck="false"></textarea>
            </div>
            
            <div class="tab-content" id="previewTab">
                <iframe id="codePreviewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
            
            <div class="tab-content" id="propertiesTab">
                <div class="properties-grid">
                    <div class="prop-item">
                        <label>File Name:</label>
                        <span id="propFileName">-</span>
                    </div>
                    <div class="prop-item">
                        <label>File Type:</label>
                        <span id="propFileType">-</span>
                    </div>
                    <div class="prop-item">
                        <label>Size:</label>
                        <span id="propFileSize">-</span>
                    </div>
                    <div class="prop-item">
                        <label>Created:</label>
                        <span id="propFileCreated">-</span>
                    </div>
                    <div class="prop-item">
                        <label>Modified:</label>
                        <span id="propFileModified">-</span>
                    </div>
                    <div class="prop-item">
                        <label>Lines:</label>
                        <span id="propFileLines">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="../../../digital/digital-system.js"></script>
