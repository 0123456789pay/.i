<!-- Deployment Module -->
<div class="module-wrapper" id="deployment-module">
    <div class="module-header">
        <h2><i class="fas fa-rocket"></i> Deployment</h2>
        <div class="module-actions">
            <button class="btn-module" onclick="ModuleActions.refresh('deployment')"><i class="fas fa-sync"></i></button>
            <button class="btn-module" onclick="ModuleActions.settings('deployment')"><i class="fas fa-cog"></i></button>
        </div>
    </div>
    <div class="module-body">
        <div class="deploy-section">
            <div class="deploy-targets">
                <h3>Deploy To</h3>
                <label><input type="radio" name="target" value="netlify" checked> Netlify</label>
                <label><input type="radio" name="target" value="vercel"> Vercel</label>
                <label><input type="radio" name="target" value="github"> GitHub Pages</label>
                <label><input type="radio" name="target" value="ftp"> FTP Server</label>
            </div>
            <div class="deploy-status">
                <h3>Status</h3>
                <div id="deployStatus">Ready to deploy</div>
            </div>
            <button id="deployBtn" class="btn-primary btn-large">Deploy Now</button>
        </div>
    </div>
</div>
