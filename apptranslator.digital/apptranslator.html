<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southeast App - Apptranslator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --primary-color: #2563eb; --secondary-color: #1e40af; --success-color: #10b981; --warning-color: #f59e0b; --danger-color: #ef4444; --light-bg: #f3f4f6; --border-color: #e5e7eb; --text-primary: #111827; --text-secondary: #6b7280; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 0; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 90%; max-width: 600px; padding: 30px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary-color); font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .content { text-align: center; padding: 40px 20px; }
        .icon-large { font-size: 80px; color: var(--primary-color); margin-bottom: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease; background: var(--primary-color); color: white; margin: 5px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; margin-bottom: 15px; }
        .result-box { background: var(--light-bg); padding: 20px; border-radius: 8px; margin-top: 20px; min-height: 60px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1><i class="fas fa-translator"></i> Apptranslator</h1></div>
        <div class="content">
            <div class="icon-large"><i class="fas fa-translator"></i></div>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Apptranslator application interface ready for use.</p>
            <button class="btn" onclick="alert('Apptranslator feature activated!')"><i class="fas fa-play"></i> Launch</button>
            <button class="btn" style="background: var(--success-color);" onclick="alert('Settings opened!')"><i class="fas fa-cog"></i> Settings</button>
        </div>
    </div>
</body>
</html>
