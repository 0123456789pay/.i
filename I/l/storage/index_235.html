one">Bantuan</a></li> </ul> </div> </nav> <div class="page-container"> <div class="content-header"> <h1><span class="icon-placeholder">📌</span> Manajemen Konten</h1> <p class="mb-0">Kelola semua konten startup dan bisnis digital Anda</p> </div> <div class="content-grid" id="contentGrid"> <!-- Content will be populated by JavaScript --> </div> </div> <script> const contents = [ { title: 'Panduan Startup', icon: 'fa-book', desc: 'Panduan lengkap memulai startup', date: '2024-01-15' }, { title: 'Tips Funding', icon: 'fa-money-bill', desc: 'Cara mendapatkan pendanaan', date: '2024-01-14' }, { title: 'Marketing Digital', icon: 'fa-bullhorn', desc: 'Strategi pemasaran digital', date: '2024-01-13' }, { title: 'Business Model', icon: 'fa-chart-pie', desc: 'Model bisnis yang efektif', date: '2024-01-12' }, { title: 'Team Building', icon: 'fa-users', desc: 'Membangun tim solid', date: '2024-01-11' }, { title: 'Product Launch', icon: 'fa-rocket', desc: 'Strategi launch produk', date: '2024-01-10' } ]; document.getElementById('contentGrid').innerHTML = contents.map(c => ` <div class="content-card"> <div class="content-img"><i class="fas ${c.icon}"></i></div> <div class="content-body"> <h3 class="content-title">${c.title}</h3> <p class="content-desc">${c.desc}</p> <div class="content-meta"> <span><span class="icon-placeholder">📌</span> ${c.date}</span> <button class="btn btn-sm btn-primary">Baca</button> </div> </div> </div> `).join(''); </script> </body> </html>
