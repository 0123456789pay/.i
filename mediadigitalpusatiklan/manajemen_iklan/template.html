<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: #2c3e50; color: white; padding: 20px; margin-bottom: 20px; }
        .nav { background: #34495e; padding: 10px; }
        .nav a { color: white; text-decoration: none; padding: 10px 15px; display: inline-block; }
        .nav a:hover { background: #1abc9c; }
        .content { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { background: #1abc9c; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #16a085; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #34495e; color: white; }
    </style>
    <link rel="stylesheet" href="../../digital/digital-system.css">
</head>
<body>
    <div class="header">
        <h1>{{TITLE}}</h1>
    </div>
    <div class="nav">
        <a href="digital.html">Dashboard</a>
        <a href="kampanye_aktif.html">Kampanye Aktif</a>
        <a href="laporan.html">Laporan</a>
    </div>
    <div class="container">
        <div class="content">
            {{CONTENT}}
        </div>
    </div>
    <script>
        // JavaScript untuk interaksi
        document.addEventListener('DOMContentLoaded', function() {
            console.log('{{TITLE}} loaded');
        });
    </script>
    <script src="../../digital/digital-system.js"></script>
</body>
</html>
