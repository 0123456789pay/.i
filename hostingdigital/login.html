<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Client Area</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="logo">HostingDigital</a>
                <ul class="nav-menu">
                    <li class="nav-item"><a href="index.html" class="nav-link">Beranda</a></li>
                    <li class="nav-item"><a href="register.html" class="btn btn-primary">Daftar</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero" style="padding:3rem 0;">
        <div class="container">
            <h1>Login Client Area</h1>
        </div>
    </section>

    <section class="features">
        <div class="container">
            <div style="max-width:400px; margin:0 auto;">
                <form action="includes/auth.php" method="POST" data-validate>
                    <div style="margin-bottom:1rem;">
                        <label>Email</label>
                        <input type="email" name="email" required style="width:100%; padding:0.75rem; border:1px solid #e5e7eb; border-radius:8px; margin-top:0.5rem;">
                    </div>
                    <div style="margin-bottom:1rem;">
                        <label>Password</label>
                        <input type="password" name="password" required style="width:100%; padding:0.75rem; border:1px solid #e5e7eb; border-radius:8px; margin-top:0.5rem;">
                    </div>
                    <div style="margin-bottom:1rem;">
                        <label><input type="checkbox" name="remember"> Ingat Saya</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
                    <p style="text-align:center; margin-top:1rem;">
                        <a href="forgot-password.html">Lupa Password?</a> | 
                        <a href="register.html">Belum punya akun? Daftar</a>
                    </p>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>2024 HostingDigital. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
