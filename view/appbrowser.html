<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Browser - WebView Container</title>
    <link rel="stylesheet" href="/controlproxy/browser.css">
</head>
<body>
    <div class="browser-container">
        <!-- Header Bar -->
        <header class="browser-header">
            <div class="header-left">
                <span class="app-icon">🌐</span>
                <h1 class="app-title">App Browser</h1>
                <span class="user-badge" id="userBadge">👤 logreg197@gmail.com</span>
            </div>
            
            <div class="url-bar-container">
                <input type="text" id="urlInput" class="url-input" placeholder="Enter URL..." value="https://coder.qwen.ai">
                <button id="goBtn" class="btn-go">🚀 Go</button>
                <button id="proxyToggle" class="btn-proxy active" title="Toggle Proxy Mode">
                    🛡️ Proxy: <span id="proxyStatus">ON</span>
                </button>
                <button id="userBtn" class="btn-user" title="Change User">👤 User</button>
            </div>
            
            <div class="header-right">
                <button id="refreshBtn" class="btn-icon" title="Refresh">🔄</button>
                <button id="homeBtn" class="btn-icon" title="Home">🏠</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="browser-main">
            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="loading-indicator hidden">
                <div class="spinner"></div>
                <p>Loading...</p>
            </div>

            <!-- Error/Fallback Message -->
            <div id="fallbackMessage" class="fallback-message hidden">
                <div class="fallback-content">
                    <h2>⚠️ Content Cannot Be Loaded</h2>
                    <p id="fallbackReason">This website blocks embedding in iframes.</p>
                    <div class="fallback-actions">
                        <button id="tryProxyBtn" class="btn-action">🛡️ Try with Proxy</button>
                        <button id="openNewTabBtn" class="btn-action secondary">🔗 Open in New Tab</button>
                        <button id="backBtn" class="btn-action secondary">← Back</button>
                    </div>
                </div>
            </div>

            <!-- Iframe Container -->
            <div class="iframe-wrapper">
                <iframe id="contentFrame" class="content-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-top-navigation-by-user-activation" allow="geolocation; microphone; camera; fullscreen; payment; clipboard-write; autoplay"></iframe>
            </div>
        </main>

        <!-- Quick Bookmarks Bar -->
        <footer class="bookmarks-bar">
            <button class="bookmark-item" data-url="https://coder.qwen.ai">🤖 Coder Qwen</button>
            <button class="bookmark-item" data-url="https://google.com">🔍 Google</button>
            <button class="bookmark-item" data-url="https://accounts.google.com">🔐 Google Login</button>
            <button class="bookmark-item" data-url="https://github.com">🐙 GitHub</button>
            <button class="bookmark-item" data-url="https://stackoverflow.com">📚 Stack Overflow</button>
            <button class="bookmark-item" data-url="https://youtube.com">📺 YouTube</button>
        </footer>
    </div>

    <!-- Load Proxy Configuration -->
    <script src="/controlproxy/proxymanager.js"></script>
    <script src="/controlproxy/browser.js"></script>
</body>
</html>
