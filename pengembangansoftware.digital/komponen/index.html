<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komponen - PENGEMBANGANSOFTWARE.DIGITAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .component-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .component-card:hover {
            border-color: #0066ff;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.15);
        }
        .component-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0047b3 0%, #0066ff 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .component-type {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: #e6f0ff;
            color: #0066ff;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <nav class="brand-navbar">
        <div class="container-fluid">
            <a href="../index.html" class="brand-logo">
                <i class="fas fa-arrow-left"></i>
                <span>PENGEMBANGANSOFTWARE.DIGITAL</span>
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <h1 style="margin-top: 100px; margin-bottom: 1rem;"><i class="fas fa-puzzle-piece"></i> Komponen</h1>
            <p style="color: var(--text-light);">Manajemen komponen fungsional sistem digital</p>

            <div class="search-section" style="margin-top: 2rem;">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchComponent" placeholder="Cari komponen..." onkeyup="filterComponents()" />
                </div>
            </div>

            <div class="component-grid" id="componentGrid">
                <!-- Components will be rendered here -->
            </div>
        </div>
    </main>

    <script>
        const components = [
            { name: 'UI Components', icon: 'fa-desktop', type: 'Frontend', files: 45 },
            { name: 'API Module', icon: 'fa-plug', type: 'Backend', files: 32 },
            { name: 'Database Connector', icon: 'fa-database', type: 'Backend', files: 28 },
            { name: 'Auth System', icon: 'fa-shield-alt', type: 'Security', files: 24 },
            { name: 'File Manager', icon: 'fa-folder-open', type: 'Utility', files: 38 },
            { name: 'Notification', icon: 'fa-bell', type: 'Frontend', files: 19 },
            { name: 'Chart Engine', icon: 'fa-chart-bar', type: 'Analytics', files: 42 },
            { name: 'Form Validator', icon: 'fa-check-double', type: 'Utility', files: 15 },
            { name: 'Image Processor', icon: 'fa-image', type: 'Media', files: 27 },
            { name: 'Email Service', icon: 'fa-envelope', type: 'Backend', files: 22 },
            { name: 'Payment Gateway', icon: 'fa-credit-card', type: 'Integration', files: 35 },
            { name: 'Search Engine', icon: 'fa-search', type: 'Backend', files: 31 }
        ];

        function renderComponents(data) {
            const grid = document.getElementById('componentGrid');
            grid.innerHTML = '';
            
            data.forEach(comp => {
                const card = document.createElement('div');
                card.className = 'component-card';
                card.innerHTML = `
                    <div class="component-icon"><i class="fas ${comp.icon}"></i></div>
                    <h4>${comp.name}</h4>
                    <span class="component-type">${comp.type}</span>
                    <div style="margin-top: 1rem; color: var(--text-light); font-size: 0.9rem;">
                        <i class="fas fa-file-code"></i> ${comp.files} file
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterComponents() {
            const query = document.getElementById('searchComponent').value.toLowerCase();
            const filtered = components.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.type.toLowerCase().includes(query)
            );
            renderComponents(filtered);
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderComponents(components);
        });
    </script>
</body>
</html>
