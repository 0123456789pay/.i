# ReberPencarian.digital - Menu System Configuration
# Protocol: reberpencarian.digital
# Type: Menu Components Config
# Version: 1.0.0

[module]
id = "menu-system"
name = "Menu Components"
description = "Sistem Menu Terintegrasi untuk ReberPencarian"
active = true
version = "1.0.0"
selector_symbol = "TRUE"

[core]
engine = "ReberCore-TRUE"
root_input = enabled
universal_access = true
config_driven = true

[navigation]
enable_main_nav = true
enable_sidebar = true
enable_context_menu = true
enable_dropdowns = true
sticky_header = true
mobile_responsive = true

[menu_items]
primary = ["home", "search", "explore", "bookmarks", "history"]
sidebar_sections = ["categories", "tools", "configuration"]
dropdown_menus = ["settings", "profile", "notifications"]
context_actions = ["open", "bookmark", "copy-link", "share", "properties"]

[shortcuts]
alt_m = "toggle_sidebar"
alt_s = "focus_quick_search"
alt_b = "open_bookmarks"
alt_h = "open_history"
escape = "close_all_menus"

[styling]
theme = "white_blue"
primary_color = "#0047b3"
secondary_color = "#0066ff"
gradient = "linear-gradient(135deg, #0047b3 0%, #0066ff 100%)"
border_radius_sm = "8px"
border_radius_md = "12px"
border_radius_lg = "16px"
shadow_enabled = true
animations_enabled = true

[regex_patterns]
url_pattern = "/^(https?:\\/\\/|ftp:\\/\\/|file:\\/\\/|data:|reber:\\/\\/)[^\\s]+$/"
domain_pattern = "/^[a-zA-Z0-9][a-zA-Z0-9\\-]{0,61}[a-zA-Z0-9]?\\.[a-zA-Z]{2,}$/"
ip_pattern = "/^(\\d{1,3}\\.){3}\\d{1,3}(:\\d{1,5})?$/"
email_pattern = "/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/"
sanitize_pattern = "/<[^>]*>/g"

[features]
quick_search = true
notification_system = true
badge_counters = true
keyboard_navigation = true
touch_gestures = true
accessibility_support = true

[integration]
connect_to_core = true
share_state_with_search = true
sync_bookmarks = true
sync_history = true
load_config_from_files = true

[performance]
lazy_load_menus = false
cache_menu_state = true
debounce_search = 300
animation_duration = 300

[security]
sanitize_inputs = true
validate_urls = true
prevent_xss = true
csrf_protection = true
