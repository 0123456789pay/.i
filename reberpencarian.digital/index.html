<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReberPencarian.digital - Mesin Pencari Universal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Browser-like Header -->
    <header class="browser-header">
        <div class="nav-buttons">
            <button class="nav-btn" id="btnBack" title="Kembali">←</button>
            <button class="nav-btn" id="btnForward" title="Maju">→</button>
            <button class="nav-btn" id="btnRefresh" title="Segarkan">↻</button>
            <button class="nav-btn" id="btnHome" title="Beranda">⌂</button>
        </div>
        
        <div class="url-bar-container">
            <div class="url-input-wrapper">
                <select class="protocol-selector" id="protocolSelector">
                    <option value="https://">HTTPS</option>
                    <option value="http://">HTTP</option>
                    <option value="ftp://">FTP</option>
                    <option value="file://">FILE</option>
                    <option value="data:">DATA</option>
                    <option value="reber://">REBER</option>
                </select>
                <input type="text" id="urlInput" placeholder="Masukkan URL atau kata kunci pencarian..." autocomplete="off">
                <button class="search-btn" id="searchBtn">
                    <span>✓</span> Cari
                </button>
            </div>
        </div>
        
        <!-- Menu Pencarian di Kanan -->
        <div class="search-menu">
            <button class="menu-btn" id="btnHistory" title="Riwayat">🕐</button>
            <button class="menu-btn" id="btnBookmarks" title="Bookmark">⭐</button>
            <button class="menu-btn" id="btnDownloads" title="Unduhan">⬇️</button>
            <button class="menu-btn" id="btnSettings" title="Pengaturan">⚙</button>
            <button class="menu-btn" id="btnMoreOptions" title="Opsi Lainnya">⋮</button>
        </div>
    </header>

    <!-- Tab Bar Section (di bawah kolom pencarian) -->
    <section class="tab-bar-section" id="tabBarSection">
        <div class="tab-bar-container">
            <div class="tab-list" id="tabList">
                <!-- Tab akan ditambahkan di sini secara dinamis -->
            </div>
            <button class="close-all-tabs" id="closeAllTabs" title="Tutup Semua Tab">×</button>
        </div>
    </section>

    <!-- Main Container - Hanya Kartu-kartu Situs -->
    <div class="main-container">
        <!-- Sites Grid - 7 Kolom -->
        <div class="sites-grid-main" id="sitesGridMain">
            <!-- Kartu-kartu situs akan di-generate oleh JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#" class="footer-link">Tentang Kami</a>
            <a href="#" class="footer-link">Privasi</a>
            <a href="#" class="footer-link">Syarat Layanan</a>
            <a href="#" class="footer-link">Kontak</a>
            <a href="#" class="footer-link">API</a>
        </div>
        <p class="footer-text">&copy; 2024 ReberPencarian.digital - Mesin Pencari Universal. All rights reserved.</p>
    </footer>

    <!-- Tab Content Overlay -->
    <div class="tab-content-overlay" id="tabContentOverlay">
        <div class="tab-content-panel">
            <div class="tab-content-header">
                <h3 id="tabContentTitle">Judul Tab</h3>
                <button class="close-tab-btn" id="closeTabBtn">×</button>
            </div>
            <div class="tab-content-body" id="tabContentBody">
                <!-- Konten tab akan ditampilkan di sini -->
            </div>
        </div>
    </div>

    <script src="js/core.js"></script>
</body>
</html>
