<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReberPencarian.digital - Mesin Pencari Universal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Hero Section - Kolom Pencarian di Tengah -->
    <section class="hero-section" id="heroSection">
        <div class="hero-content">
            <h1 class="hero-title">ReberPencarian.digital</h1>
            <p class="hero-subtitle">Mesin Pencari Universal</p>
            
            <div class="search-box-centered">
                <div class="search-input-wrapper">
                    <select class="protocol-selector-centered" id="protocolSelectorCentered">
                        <option value="https://">HTTPS</option>
                        <option value="http://">HTTP</option>
                        <option value="ftp://">FTP</option>
                        <option value="file://">FILE</option>
                        <option value="data:">DATA</option>
                        <option value="reber://">REBER</option>
                    </select>
                    <input type="text" id="searchInputCentered" placeholder="Masukkan kata kunci pencarian..." autocomplete="off">
                    <button class="search-btn-centered" id="searchBtnCentered">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            
            <div class="quick-links">
                <a href="#" class="quick-link" data-category="all"><i class="fas fa-th"></i> Semua</a>
                <a href="#" class="quick-link" data-category="image"><i class="fas fa-image"></i> Gambar</a>
                <a href="#" class="quick-link" data-category="video"><i class="fas fa-video"></i> Video</a>
                <a href="#" class="quick-link" data-category="shopping"><i class="fas fa-shopping-cart"></i> Belanja</a>
            </div>
        </div>
    </section>

    <!-- Browser-like Header -->
    <header class="browser-header">
        <div class="nav-buttons">
            <button class="nav-btn" id="btnBack" title="Kembali"><i class="fas fa-arrow-left"></i></button>
            <button class="nav-btn" id="btnForward" title="Maju"><i class="fas fa-arrow-right"></i></button>
            <button class="nav-btn" id="btnRefresh" title="Segarkan"><i class="fas fa-redo"></i></button>
            <!-- Tombol Rumah/Beranda di samping kolom pencarian -->
            <button class="nav-btn btn-home-active" id="btnHomeActive" title="Tampilkan Beranda - Situs Digital"><i class="fas fa-home"></i></button>
        </div>
        
        <div class="url-bar-container">
            <div class="url-input-wrapper">
                <select class="protocol-selector" id="protocolSelector">
                    <option value="https://">HTTPS</option>
                    <option value="http://">HTTP</option>
                    <option value="ftp://">FTP</option>
                    <option value="file://">FILE</option>
                    <option value="data:">DATA</option>
                    <option value="reber://">REBER</option>
                </select>
                <input type="text" id="urlInput" placeholder="Masukkan URL atau kata kunci pencarian..." autocomplete="off">
                <button class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i> Cari
                </button>
            </div>
        </div>
        
        <!-- Menu Pencarian di Kanan -->
        <div class="search-menu">
            <button class="menu-btn" id="btnHistory" title="Riwayat"><i class="fas fa-history"></i></button>
            <button class="menu-btn" id="btnBookmarks" title="Bookmark"><i class="fas fa-star"></i></button>
            <button class="menu-btn" id="btnDownloads" title="Unduhan"><i class="fas fa-download"></i></button>
            <button class="menu-btn" id="btnSettings" title="Pengaturan"><i class="fas fa-cog"></i></button>
            <button class="menu-btn" id="btnMoreOptions" title="Opsi Lainnya"><i class="fas fa-ellipsis-v"></i></button>
            
            <!-- Modal Menu List Kecil -->
            <div class="menu-dropdown" id="menuDropdown">
                <div class="menu-dropdown-header">
                    <h4>Menu</h4>
                    <button class="dropdown-close-btn" id="dropdownCloseBtn">×</button>
                </div>
                <ul class="menu-dropdown-list">
                    <li class="menu-dropdown-item" data-action="history">
                        <span class="menu-icon"><i class="fas fa-history"></i></span>
                        <span class="menu-label">Riwayat Pencarian</span>
                    </li>
                    <li class="menu-dropdown-item" data-action="bookmarks">
                        <span class="menu-icon"><i class="fas fa-star"></i></span>
                        <span class="menu-label">Bookmark</span>
                    </li>
                    <li class="menu-dropdown-item" data-action="downloads">
                        <span class="menu-icon"><i class="fas fa-download"></i></span>
                        <span class="menu-label">Unduhan</span>
                    </li>
                    <li class="menu-dropdown-item" data-action="settings">
                        <span class="menu-icon"><i class="fas fa-cog"></i></span>
                        <span class="menu-label">Pengaturan</span>
                    </li>
                    <li class="menu-dropdown-item" data-action="export">
                        <span class="menu-icon"><i class="fas fa-upload"></i></span>
                        <span class="menu-label">Export Data</span>
                    </li>
                    <li class="menu-dropdown-item" data-action="import">
                        <span class="menu-icon"><i class="fas fa-download"></i></span>
                        <span class="menu-label">Import Data</span>
                    </li>
                    <li class="menu-dropdown-item" data-action="help">
                        <span class="menu-icon"><i class="fas fa-question-circle"></i></span>
                        <span class="menu-label">Bantuan</span>
                    </li>
                    <li class="menu-dropdown-item" data-action="about">
                        <span class="menu-icon"><i class="fas fa-info-circle"></i></span>
                        <span class="menu-label">Tentang</span>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Search Engine View Section - WebView dengan AppBrowser Embedded (Tampilan Utama Layar Penuh) -->
    <section class="search-engine-view main-tab-view" id="searchEngineView">
        <div class="search-engine-container full-height-container">
            <!-- Filter Bar - Jenis Domain (Tetap Dipertahankan) -->
            <div class="filter-bar-container" id="filterBarContainer">
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all"><i class="fas fa-th"></i> Semua</button>
                    <button class="filter-btn" data-filter="text"><i class="fas fa-file-alt"></i> Teks</button>
                    <button class="filter-btn" data-filter="image"><i class="fas fa-image"></i> Gambar</button>
                    <button class="filter-btn" data-filter="video"><i class="fas fa-video"></i> Video</button>
                    <button class="filter-btn" data-filter="movie"><i class="fas fa-film"></i> Film</button>
                    <button class="filter-btn" data-filter="shopping"><i class="fas fa-shopping-cart"></i> Belanja</button>
                </div>
                <div class="results-info">
                    <span id="resultsCountInfo">Menampilkan 0 hasil</span>
                </div>
            </div>

            <!-- AppBrowser Embedded Container -->
            <div class="content-frame main-content-frame" id="appBrowserContainer">
                <iframe src="../appbrowser.html" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </section>

    <!-- Main Container - Kartu-kartu Situs (untuk fallback) -->
    <div class="main-container" style="display: none;">
        <!-- Sites Grid - 7 Kolom (responsive) -->
        <div class="sites-grid-main" id="sitesGridMain">
            <!-- Kartu-kartu situs akan di-generate oleh JavaScript -->
        </div>
    </div>

    <!-- Tab Content Overlay -->
    <div class="tab-content-overlay" id="tabContentOverlay">
        <div class="tab-content-panel">
            <div class="tab-content-header">
                <h3 id="tabContentTitle">Judul Tab</h3>
                <button class="close-tab-btn" id="closeTabBtn">×</button>
            </div>
            <div class="tab-content-body" id="tabContentBody">
                <!-- Konten tab akan ditampilkan di sini -->
            </div>
        </div>
    </div>

    <script src="js/core.js"></script>
</body>
</html>
