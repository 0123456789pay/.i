<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Center Management - Media.Digital</title>
    <style>
        :root { --primary: #4f46e5; --secondary: #06b6d4; --dark: #0f172a; --light: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #020617, #0f172a); color: var(--light); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        h1 { font-size: 32px; margin-bottom: 10px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .stat-card { background: rgba(30,41,59,0.5); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--secondary); }
        .server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 30px; }
        .server-card { background: rgba(30,41,59,0.5); padding: 20px; border-radius: 10px; border-left: 4px solid #10b981; }
        .server-card.warning { border-left-color: #f59e0b; }
        .server-card.offline { border-left-color: #ef4444; }
        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 3px; transition: width 1s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖥️ Data Center Management</h1>
        <p>Sistem manajemen infrastruktur data center terdistribusi dengan ribuan node</p>
        
        <div class="stats">
            <div class="stat-card"><div class="stat-value">575</div><div>Node Server Aktif</div></div>
            <div class="stat-card"><div class="stat-value">2,875</div><div>Virtual Machines</div></div>
            <div class="stat-card"><div class="stat-value">10,000+</div><div>Containers</div></div>
            <div class="stat-card"><div class="stat-value">99.99%</div><div>Uptime SLA</div></div>
        </div>
        
        <h2 style="margin-top: 40px;">Status Server Real-time</h2>
        <div class="server-grid" id="serverGrid"></div>
    </div>
    
    <script>
        const servers = [];
        for(let i=1; i<=575; i++) {
            const status = Math.random() > 0.05 ? (Math.random() > 0.1 ? 'online' : 'warning') : 'offline';
            const cpu = Math.floor(Math.random() * 100);
            const ram = Math.floor(Math.random() * 100);
            const storage = Math.floor(Math.random() * 100);
            servers.push({id: i, status, cpu, ram, storage});
        }
        
        const serverGrid = document.getElementById('serverGrid');
        servers.slice(0, 20).forEach(server => {
            const card = document.createElement('div');
            card.className = `server-card ${server.status}`;
            card.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                    <strong>Server DC-${String(server.id).padStart(3,'0')}</strong>
                    <span style="color:${server.status==='online'?'#10b981':server.status==='warning'?'#f59e0b':'#ef4444'}">● ${server.status.toUpperCase()}</span>
                </div>
                <div>CPU: ${server.cpu}%<div class="progress-bar"><div class="progress-fill" style="width:${server.cpu}%"></div></div></div>
                <div>RAM: ${server.ram}%<div class="progress-bar"><div class="progress-fill" style="width:${server.ram}%"></div></div></div>
                <div>Storage: ${server.storage}%<div class="progress-bar"><div class="progress-fill" style="width:${server.storage}%"></div></div></div>
            `;
            serverGrid.appendChild(card);
        });
    </script>
</body>
</html>
