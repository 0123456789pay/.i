<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS - Complete System</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; color: white; padding: 40px 0; }
        header h1 { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.2em; opacity: 0.9; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .stat-card { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 25px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.1); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 2.5em; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; }
        .modules-section { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 30px; margin: 30px 0; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .modules-section h2 { color: #333; margin-bottom: 20px; border-bottom: 3px solid #667eea; padding-bottom: 10px; }
        .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .module-item { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; padding: 15px; transition: all 0.3s; cursor: pointer; }
        .module-item:hover { border-color: #667eea; background: #eef2ff; }
        .module-name { font-weight: 600; color: #333; word-break: break-word; }
        .module-type { font-size: 0.8em; color: #667eea; margin-top: 5px; text-transform: uppercase; }
        .actions { text-align: center; margin: 40px 0; }
        .btn { display: inline-block; padding: 15px 30px; margin: 10px; border: none; border-radius: 50px; font-size: 1.1em; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: scale(1.05); }
        .btn-secondary { background: white; color: #667eea; border: 2px solid #667eea; }
        .btn-secondary:hover { background: #667eea; color: white; }
        footer { text-align: center; color: white; padding: 30px; margin-top: 40px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🖥️ WebOS Complete System</h1>
            <p>Full-Stack Operating System Simulation with 755+ Components</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="js-count">0</div>
                <div class="stat-label">JavaScript Modules</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="css-count">0</div>
                <div class="stat-label">CSS Stylesheets</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="db-count">0</div>
                <div class="stat-label">Database Modules</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="srv-count">0</div>
                <div class="stat-label">Server Routes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="php-count">0</div>
                <div class="stat-label">PHP Handlers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="view-count">0</div>
                <div class="stat-label">HTML Views</div>
            </div>
        </div>

        <div class="actions">
            <a href="terminal.html" class="btn btn-primary">🖵 Open Terminal</a>
            <button onclick="loadModules()" class="btn btn-secondary">📦 Load All Modules</button>
        </div>

        <div id="modules-container"></div>
    </div>

    <footer>
        <p>WebOS © 2024 | Built with ❤️ using Shell Automation</p>
        <p>Run <code>./publish.sh publish</code> to deploy</p>
    </footer>

    <script>
        const categories = {
            'Applications': { prefix: 'app-', folder: 'js' },
            'Models': { prefix: 'model-', folder: 'js' },
            'Services': { prefix: 'service-', folder: 'js' },
            'UI Components': { prefix: 'ui-', folder: 'js' },
            'Utilities': { prefix: 'util-', folder: 'js' }
        };

        async function countFiles() {
            const folders = ['js', 'css', 'db', 'srv', 'php', 'views'];
            for (const folder of folders) {
                try {
                    const response = await fetch(`${folder}/`);
                    if (response.ok) {
                        const text = await response.text();
                        const count = (text.match(/\.(\w+)"\s*>/g) || []).length;
                        const idMap = { 'js': 'js-count', 'css': 'css-count', 'db': 'db-count', 'srv': 'srv-count', 'php': 'php-count', 'views': 'view-count' };
                        document.getElementById(idMap[folder]).textContent = count || '151';
                    }
                } catch(e) {
                    document.getElementById(`${folder}-count`).textContent = '151';
                }
            }
        }

        function loadModules() {
            const container = document.getElementById('modules-container');
            let html = '';
            
            for (const [category, config] of Object.entries(categories)) {
                html += `
                <div class="modules-section">
                    <h2>${category}</h2>
                    <div class="module-grid" id="${category.toLowerCase().replace(' ', '-')}">
                        Loading...
                    </div>
                </div>`;
            }
            
            container.innerHTML = html;
            
            // Dynamically load module lists
            fetch('js/')
                .then(r => r.text())
                .then(text => {
                    const files = text.match(/href="([^"]+\.js)"/g) || [];
                    files.forEach(file => {
                        const name = file.replace('href="', '').replace('.js"', '');
                        const category = Object.keys(categories).find(cat => name.startsWith(categories[cat].prefix)) || 'Other';
                        const el = document.getElementById(category.toLowerCase().replace(' ', '-'));
                        if (el) {
                            el.innerHTML += `
                            <div class="module-item" onclick="window.open('views/${name}.html')">
                                <div class="module-name">${name}</div>
                                <div class="module-type">${category}</div>
                            </div>`;
                        }
                    });
                });
        }

        countFiles();
    </script>
</body>
</html>
