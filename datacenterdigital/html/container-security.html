<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>container security - DataCenter Digital</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="menu-page">
    <div class="page-container">
        <header class="page-header">
            <h1>container security</h1>
            <p class="breadcrumb">DataCenter Digital > container security</p>
        </header>
        <main class="page-content">
            <section class="info-section">
                <h2>Overview</h2>
                <p>Halaman manajemen container security untuk infrastruktur datacenter Anda.</p>
            </section>
            <section class="controls-section">
                <h2>Controls</h2>
                <div class="control-grid">
                    <button class="btn btn-primary">Refresh Data</button>
                    <button class="btn btn-secondary">Export Report</button>
                    <button class="btn btn-warning">Configure Settings</button>
                    <button class="btn btn-danger">Emergency Stop</button>
                </div>
            </section>
            <section class="data-section">
                <h2>Status & Metrics</h2>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <span class="metric-label">Status</span>
                        <span class="metric-value status-active">Active</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Uptime</span>
                        <span class="metric-value">99.9%</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Last Update</span>
                        <span class="metric-value" id="last-update">-</span>
                    </div>
                    <div class="metric-card">
                        <span class="metric-label">Alerts</span>
                        <span class="metric-value alerts-none">0</span>
                    </div>
                </div>
            </section>
            <section class="logs-section">
                <h2>Activity Logs</h2>
                <div class="logs-container" id="activity-logs">
                    <p>Loading logs...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../js/app.js"></script>
    <script>
        // Page-specific script for container security
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('last-update').textContent = new Date().toLocaleString();
            console.log('Loaded: container security');
        });
    </script>
</body>
</html>
