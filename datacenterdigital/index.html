<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataCenter Digital Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard">
        <nav class="sidebar">
            <h2>🖥️ DataCenter Digital</h2>
            <ul class="menu" id="menu-list">
                <!-- Menu items loaded dynamically -->
            </ul>
        </nav>
        <main class="main-content">
            <header class="header">
                <h1>Dashboard DataCenter Digital</h1>
            </header>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Files</h3>
                    <p id="total-files">0</p>
                </div>
                <div class="stat-card">
                    <h3>Active Servers</h3>
                    <p id="active-servers">0</p>
                </div>
                <div class="stat-card">
                    <h3>Storage Used</h3>
                    <p id="storage-used">-</p>
                </div>
                <div class="stat-card">
                    <h3>Uptime</h3>
                    <p id="uptime">-</p>
                </div>
            </div>
            <div class="content-area">
                <iframe id="content-frame" src="html/welcome.html"></iframe>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
