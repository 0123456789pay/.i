<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoLife - Home</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #fff; }
        .header { background: #16213e; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 28px; font-weight: bold; color: #e94560; }
        .nav { display: flex; gap: 15px; flex-wrap: wrap; }
        .nav a { color: #fff; text-decoration: none; padding: 10px 15px; background: #0f3460; border-radius: 5px; transition: 0.3s; }
        .nav a:hover { background: #e94560; }
        .container { padding: 30px; max-width: 1400px; margin: 0 auto; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .video-card { background: #16213e; border-radius: 10px; overflow: hidden; transition: transform 0.3s; }
        .video-card:hover { transform: translateY(-5px); }
        .thumbnail { width: 100%; height: 160px; background: #0f3460; display: flex; align-items: center; justify-content: center; }
        .play-icon { font-size: 50px; color: #e94560; }
        .video-info { padding: 15px; }
        .video-title { font-size: 16px; margin-bottom: 8px; }
        .video-meta { font-size: 12px; color: #aaa; }
        .db-status { background: #0f3460; padding: 20px; margin-top: 30px; border-radius: 10px; }
        .btn { background: #e94560; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #c73e54; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #1a1a2e; border: 1px solid #0f3460; color: #fff; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎬 VideoLife</div>
        <nav class="nav" id="mainNav"></nav>
    </div>
    <div class="container">
        <h1>Selamat Datang di VideoLife</h1>
        <p>Platform video terlengkap dengan 75+ menu fitur</p>
        
        <div class="video-grid" id="videoGrid"></div>
        
        <div class="db-status">
            <h2>Database Manager</h2>
            <input type="text" id="dbInput" placeholder="Masukkan data video...">
            <textarea id="dbArea" rows="4" placeholder="Data JSON akan muncul di sini"></textarea>
            <button class="btn" onclick="saveData()">Simpan ke Database</button>
            <button class="btn" onclick="loadData()">Load Data</button>
            <button class="btn" onclick="exportData()">Export JSON</button>
            <div id="dbOutput"></div>
        </div>
    </div>

    <script>
        const menus = [
            {name: 'Home', file: 'digital.html'}, {name: 'Trending', file: 'trending.html'},
            {name: 'Terbaru', file: 'terbaru.html'}, {name: 'Populer', file: 'populer.html'},
            {name: 'Musik', file: 'musik.html'}, {name: 'Film', file: 'film.html'},
            {name: 'Serial TV', file: 'serial-tv.html'}, {name: 'Olahraga', file: 'olahraga.html'},
            {name: 'Gaming', file: 'gaming.html'}, {name: 'Berita', file: 'berita.html'},
            {name: 'Edukasi', file: 'edukasi.html'}, {name: 'Komedi', file: 'komedi.html'},
            {name: 'Animasi', file: 'animasi.html'}, {name: 'Dokumenter', file: 'dokumenter.html'},
            {name: 'Kids', file: 'kids.html'}, {name: 'Lifestyle', file: 'lifestyle.html'},
            {name: 'Teknologi', file: 'teknologi.html'}, {name: 'Otomotif', file: 'otomotif.html'},
            {name: 'Kuliner', file: 'kuliner.html'}, {name: 'Travel', file: 'travel.html'},
            {name: 'Fashion', file: 'fashion.html'}, {name: 'Kesehatan', file: 'kesehatan.html'},
            {name: 'Sains', file: 'sains.html'}, {name: 'Sejarah', file: 'sejarah.html'},
            {name: 'Seni', file: 'seni.html'}, {name: 'DIY', file: 'diy.html'},
            {name: 'Podcast', file: 'podcast.html'}, {name: 'Live', file: 'live.html'},
            {name: 'Premium', file: 'premium.html'}, {name: 'Playlist', file: 'playlist.html'},
            {name: 'Watch Later', file: 'watch-later.html'}, {name: 'Favorites', file: 'favorites.html'},
            {name: 'History', file: 'history.html'}, {name: 'Subscriptions', file: 'subscriptions.html'},
            {name: 'Community', file: 'community.html'}, {name: 'Channels', file: 'channels.html'},
            {name: 'Upload', file: 'upload.html'}, {name: 'Studio', file: 'studio.html'},
            {name: 'Analytics', file: 'analytics.html'}, {name: 'Monetization', file: 'monetization.html'},
            {name: 'Copyright', file: 'copyright.html'}, {name: 'Settings', file: 'settings.html'},
            {name: 'Profile', file: 'profile.html'}, {name: 'Account', file: 'account.html'},
            {name: 'Privacy', file: 'privacy.html'}, {name: 'Terms', file: 'terms.html'},
            {name: 'Help', file: 'help.html'}, {name: 'Contact', file: 'contact.html'},
            {name: 'About', file: 'about.html'}, {name: 'Careers', file: 'careers.html'},
            {name: 'Press', file: 'press.html'}, {name: 'Developers', file: 'developers.html'},
            {name: 'API', file: 'api.html'}, {name: 'Mobile', file: 'mobile.html'},
            {name: 'TV App', file: 'tv-app.html'}, {name: 'Download', file: 'download.html'},
            {name: 'Offline', file: 'offline.html'}, {name: 'Quality', file: 'quality.html'},
            {name: 'Subtitles', file: 'subtitles.html'}, {name: 'Playback', file: 'playback.html'},
            {name: 'Notifications', file: 'notifications.html'}, {name: 'Messages', file: 'messages.html'},
            {name: 'Comments', file: 'comments.html'}, {name: 'Reviews', file: 'reviews.html'},
            {name: 'Ratings', file: 'ratings.html'}, {name: 'Reports', file: 'reports.html'},
            {name: 'Moderation', file: 'moderation.html'}, {name: 'Safety', file: 'safety.html'},
            {name: 'Parents', file: 'parents.html'}, {name: 'Education Hub', file: 'education-hub.html'},
            {name: 'Creator Fund', file: 'creator-fund.html'}, {name: 'Merchandise', file: 'merchandise.html'},
            {name: 'Memberships', file: 'memberships.html'}, {name: 'Super Chat', file: 'super-chat.html'},
            {name: 'Premiere', file: 'premiere.html'}, {name: 'Shorts', file: 'shorts.html'},
            {name: 'Stories', file: 'stories.html'}, {name: 'Clips', file: 'clips.html'}
        ];

        function initNav() {
            const nav = document.getElementById('mainNav');
            menus.slice(0, 15).forEach(menu => {
                const a = document.createElement('a');
                a.href = menu.file;
                a.textContent = menu.name;
                nav.appendChild(a);
            });
        }

        function loadVideos() {
            const grid = document.getElementById('videoGrid');
            const videos = JSON.parse(localStorage.getItem('videolife_videos') || '[]');
            if (videos.length === 0) {
                for (let i = 1; i <= 12; i++) {
                    grid.innerHTML += `
                        <div class="video-card">
                            <div class="thumbnail"><span class="play-icon">▶</span></div>
                            <div class="video-info">
                                <div class="video-title">Video ${i}</div>
                                <div class="video-meta">10K views • 2 hours ago</div>
                            </div>
                        </div>
                    `;
                }
            } else {
                videos.forEach(v => {
                    grid.innerHTML += `
                        <div class="video-card">
                            <div class="thumbnail"><span class="play-icon">▶</span></div>
                            <div class="video-info">
                                <div class="video-title">${v.title || 'Video'}</div>
                                <div class="video-meta">${v.views || 0} views</div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function saveData() {
            const input = document.getElementById('dbInput').value;
            const videos = JSON.parse(localStorage.getItem('videolife_videos') || '[]');
            videos.push({title: input, views: Math.floor(Math.random() * 10000), date: new Date().toISOString()});
            localStorage.setItem('videolife_videos', JSON.stringify(videos));
            document.getElementById('dbOutput').innerHTML = '✓ Data saved!';
            loadVideos();
        }

        function loadData() {
            const data = localStorage.getItem('videolife_videos') || '[]';
            document.getElementById('dbArea').value = data;
            document.getElementById('dbOutput').innerHTML = `Loaded ${JSON.parse(data).length} records`;
        }

        function exportData() {
            const data = localStorage.getItem('videolife_videos') || '[]';
            const blob = new Blob([data], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'videolife_data.json';
            a.click();
        }

        initNav();
        loadVideos();
    </script>
</body>
</html>
