<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Studio</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">🤖 AI Studio</div>
                <h2>Daftar Akun Baru</h2>
                <p style="color: var(--gray-700);">Mulai gunakan platform AI kami</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="name" class="form-input" placeholder="Nama Anda" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="nama@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Daftar</button>
            </form>
            <p style="text-align: center; margin-top: 20px; color: var(--gray-700);">
                Sudah punya akun? <a href="login.html" style="color: var(--primary-blue);">Login</a>
            </p>
            <p style="text-align: center; margin-top: 15px;">
                <a href="../index.html" style="color: var(--gray-700); font-size: 14px;">← Kembali ke Dashboard</a>
            </p>
        </div>
    </div>
    <script src="../assets/js/main.js"></script>
</body>
</html>
