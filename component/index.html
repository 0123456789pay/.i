<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1800 Component Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        header { 
            text-align: center; 
            color: white; 
            padding: 30px 0; 
            margin-bottom: 30px;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        header p { font-size: 1.1em; opacity: 0.9; }
        
        .search-section {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box:focus {
            border-color: #667eea;
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .stat-card { 
            background: rgba(255,255,255,0.95); 
            border-radius: 15px; 
            padding: 20px; 
            text-align: center; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); 
            transition: transform 0.3s; 
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-number { font-size: 2em; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; }
        
        .components-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 15px; 
        }
        .component-card { 
            background: rgba(255,255,255,0.95); 
            border-radius: 10px; 
            padding: 20px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.1); 
            transition: all 0.3s;
            cursor: pointer;
        }
        .component-card:hover { 
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .component-name { 
            font-size: 1.2em; 
            font-weight: bold; 
            color: #667eea;
            margin-bottom: 10px;
            word-break: break-word;
        }
        .component-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        .component-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        .btn-view {
            background: #667eea;
            color: white;
        }
        .btn-view:hover { background: #5a6fd6; }
        .btn-load {
            background: #764ba2;
            color: white;
        }
        .btn-load:hover { background: #6a4190; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title { font-size: 1.5em; color: #667eea; }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }
        .code-block {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            overflow-x: auto;
        }
        .code-block pre {
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .loading { text-align: center; padding: 40px; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧩 1800 Component Library</h1>
            <p>Interactive component viewer with input and functionality</p>
        </header>
        
        <div class="search-section">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search components by name...">
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalComponents">0</div>
                <div class="stat-label">Total Components</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="jsFiles">0</div>
                <div class="stat-label">JavaScript Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="cssFiles">0</div>
                <div class="stat-label">CSS Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="filteredCount">0</div>
                <div class="stat-label">Filtered Results</div>
            </div>
        </div>
        
        <div id="componentsGrid" class="components-grid">
            <div class="loading">Loading components...</div>
        </div>
    </div>
    
    <div id="componentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Component Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // Daftar komponen (akan diisi secara dinamis)
        const components = [];
        
        // Load komponen dari file JSON atau hardcoded list
        async function loadComponents() {
            try {
                const response = await fetch('component_list.json');
                const data = await response.json();
                components.push(...data);
            } catch (e) {
                console.log('Using fallback component list');
                // Fallback jika file JSON tidak ada
                const fallbackComponents = [
                ];
                components.push(...fallbackComponents);
            }
            
            updateStats();
            renderComponents(components);
        }
        
        function updateStats() {
            document.getElementById('totalComponents').textContent = components.length;
            document.getElementById('jsFiles').textContent = components.length;
            document.getElementById('cssFiles').textContent = components.length;
            document.getElementById('filteredCount').textContent = components.length;
        }
        
        function renderComponents(compList) {
            const grid = document.getElementById('componentsGrid');
            grid.innerHTML = '';
            
            compList.forEach((comp, index) => {
                if (index >= 100) return; // Limit display for performance
                
                const card = document.createElement('div');
                card.className = 'component-card';
                card.innerHTML = `
                    <div class="component-name">${escapeHtml(comp.name)}</div>
                    <div class="component-info">Type: Component</div>
                    <div class="component-info">Version: 1.0.0</div>
                    <div class="component-actions">
                        <button class="btn btn-view" onclick="viewComponent('${escapeJs(comp.name)}')">View</button>
                        <button class="btn btn-load" onclick="loadComponent('${escapeJs(comp.name)}')">Load</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            document.getElementById('filteredCount').textContent = compList.length;
        }
        
        function viewComponent(name) {
            const modal = document.getElementById('componentModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            title.textContent = name;
            body.innerHTML = `
                <h3>Component Information</h3>
                <p><strong>Name:</strong> ${name}</p>
                <p><strong>Type:</strong> UI Component</p>
                <p><strong>Version:</strong> 1.0.0</p>
                
                <h3>JavaScript File</h3>
                <div class="code-block">
                    <pre id="jsCode">Loading...</pre>
                </div>
                
                <h3>CSS File</h3>
                <div class="code-block">
                    <pre id="cssCode">Loading...</pre>
                </div>
                
                <h3>Live Preview</h3>
                <div id="preview" style="margin-top: 15px;"></div>
            `;
            
            modal.classList.add('active');
            
            // Load files
            fetch(`js/${name}.js`)
                .then(r => r.text())
                .then(code => {
                    document.getElementById('jsCode').textContent = code;
                })
                .catch(e => {
                    document.getElementById('jsCode').textContent = 'Error loading file';
                });
            
            fetch(`css/${name}.css`)
                .then(r => r.text())
                .then(code => {
                    document.getElementById('cssCode').textContent = code;
                    
                    // Create preview
                    const preview = document.getElementById('preview');
                    preview.innerHTML = `<div class="${name}-container">Preview of ${name} component</div>`;
                    
                    // Inject styles
                    const style = document.createElement('style');
                    style.textContent = code;
                    preview.appendChild(style);
                })
                .catch(e => {
                    document.getElementById('cssCode').textContent = 'Error loading file';
                });
        }
        
        function loadComponent(name) {
            alert(`Loading component: ${name}\n\nIn a real application, this would dynamically import the module.`);
            console.log(`Loading ${name}...`);
        }
        
        function closeModal() {
            document.getElementById('componentModal').classList.remove('active');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function escapeJs(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = components.filter(comp => 
                comp.name.toLowerCase().includes(query)
            );
            renderComponents(filtered);
        });
        
        // Close modal on outside click
        document.getElementById('componentModal').addEventListener('click', (e) => {
            if (e.target.id === 'componentModal') {
                closeModal();
            }
        });
        
        // Initialize
        loadComponents();
    </script>
</body>
</html>
