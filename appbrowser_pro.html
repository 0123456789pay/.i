<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southeast App - Browser Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-bg: #1f2937;
            --light-bg: #f3f4f6;
            --border-color: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: white;
            color: var(--primary-color);
        }

        .btn-primary:hover {
            background: var(--light-bg);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .browser-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
        }

        .toolbar {
            background: var(--light-bg);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 5px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-container {
            flex: 1;
            position: relative;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: white;
            border-radius: 8px;
            padding: 5px;
            border: 1px solid var(--border-color);
        }

        .search-engine-select {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: var(--light-bg);
            cursor: pointer;
            font-size: 13px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 8px 15px;
            font-size: 14px;
        }

        .search-btn {
            padding: 8px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: var(--secondary-color);
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
            margin-top: 5px;
        }

        .search-suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s ease;
        }

        .suggestion-item:hover {
            background: var(--light-bg);
        }

        .suggestion-item i {
            color: var(--primary-color);
        }

        .url-bar {
            background: white;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-left: 10px;
            flex: 1;
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .url-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            padding: 5px;
        }

        .url-btn {
            padding: 8px 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .url-btn:hover {
            background: var(--secondary-color);
        }

        .user-btn {
            background: var(--success-color);
        }

        .user-btn:hover {
            background: #059669;
        }

        .content-frame {
            flex: 1;
            background: white;
            border: none;
            position: relative;
        }

        .content-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .iframe-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--light-bg);
            color: var(--text-secondary);
        }

        .iframe-placeholder i {
            font-size: 80px;
            color: var(--primary-color);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .iframe-placeholder h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .iframe-placeholder p {
            font-size: 16px;
        }

        .tabs-container {
            background: var(--dark-bg);
            padding: 10px 20px 0;
            display: flex;
            gap: 5px;
            overflow-x: auto;
        }

        .tab {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 200px;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: white;
            color: var(--text-primary);
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }

        .tab-close {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .tab-close:hover {
            background: var(--danger-color);
            color: white;
        }

        .new-tab-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .new-tab-btn:hover {
            background: var(--success-color);
        }

        .bookmarks-bar {
            background: white;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .bookmark-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: var(--light-bg);
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-size: 13px;
        }

        .bookmark-item:hover {
            background: var(--primary-color);
            color: white;
        }

        .history-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .history-panel.active {
            right: 0;
        }

        .history-header {
            padding: 20px;
            background: var(--primary-color);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            padding: 20px;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .history-item:hover {
            background: var(--light-bg);
        }

        .history-item h4 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .history-item p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            border: 3px solid var(--light-bg);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* Proxy mode indicator */
        .proxy-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            font-size: 12px;
        }

        .proxy-indicator.active {
            background: var(--success-color);
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-wrap: wrap;
            }

            .url-bar {
                width: 100%;
                margin-left: 0;
                margin-top: 10px;
            }

            .history-panel {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-globe"></i> Web Browser Pro</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="toggleProxyMode()" id="proxyBtn" title="Toggle Proxy Mode">
                    <i class="fas fa-shield-alt"></i> <span id="proxyStatus">Proxy: OFF</span>
                </button>
                <button class="btn btn-primary" onclick="toggleHistory()">
                    <i class="fas fa-history"></i> History
                </button>
                <button class="btn btn-primary" onclick="window.location.href='digital.html'">
                    <i class="fas fa-home"></i> Home
                </button>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tab active" data-id="1">
                <span class="tab-title">New Tab</span>
                <span class="tab-close" onclick="closeTab(event, 1)">&times;</span>
            </div>
            <button class="new-tab-btn" onclick="openNewTab()">+</button>
        </div>

        <div class="browser-container">
            <div class="toolbar">
                <div class="nav-buttons">
                    <button class="nav-btn" onclick="goBack()" title="Back">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <button class="nav-btn" onclick="goForward()" title="Forward">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <button class="nav-btn" onclick="refreshPage()" title="Refresh">
                        <i class="fas fa-redo"></i>
                    </button>
                    <button class="nav-btn" onclick="goHome()" title="Home">
                        <i class="fas fa-home"></i>
                    </button>
                </div>

                <div class="search-container">
                    <div class="search-box">
                        <select class="search-engine-select" id="searchEngine">
                            <option value="google">Google</option>
                            <option value="bing">Bing</option>
                            <option value="youtube">YouTube</option>
                            <option value="github">GitHub</option>
                            <option value="stackoverflow">Stack Overflow</option>
                        </select>
                        <input type="text" 
                               class="search-input" 
                               id="searchInput" 
                               placeholder="Search or enter URL..."
                               oninput="showSearchSuggestions()"
                               onkeypress="handleSearchKeyPress(event)"
                               autocomplete="off">
                        <button class="search-btn" onclick="performSearch()">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                    <div class="search-suggestions" id="searchSuggestions"></div>
                </div>

                <div class="url-bar" id="urlBar">
                    <input type="text" class="url-input" id="urlInput" placeholder="https://coder.qwen.ai" value="https://coder.qwen.ai">
                    <button class="url-btn" onclick="loadFromInput()" title="Buka URL">
                        <i class="fas fa-rocket"></i> Go
                    </button>
                    <button class="url-btn user-btn" onclick="setUserEmail()" title="Set User Email">
                        <i class="fas fa-user"></i> User
                    </button>
                </div>
            </div>

            <div class="bookmarks-bar" id="bookmarksBar">
                <div class="bookmark-item" onclick="loadURL('https://coder.qwen.ai')">
                    <i class="fas fa-code"></i> Coder Qwen
                </div>
                <div class="bookmark-item" onclick="loadURL('https://www.google.com')">
                    <i class="fab fa-google"></i> Google
                </div>
                <div class="bookmark-item" onclick="loadURL('https://accounts.google.com')">
                    <i class="fab fa-google"></i> Google Login
                </div>
                <div class="bookmark-item" onclick="loadURL('https://www.github.com')">
                    <i class="fab fa-github"></i> GitHub
                </div>
                <div class="bookmark-item" onclick="loadURL('https://www.stackoverflow.com')">
                    <i class="fab fa-stack-overflow"></i> Stack Overflow
                </div>
                <div class="bookmark-item" onclick="loadURL('https://www.youtube.com')">
                    <i class="fab fa-youtube"></i> YouTube
                </div>
                <div class="bookmark-item" onclick="addBookmark()">
                    <i class="fas fa-plus"></i> Add Bookmark
                </div>
            </div>

            <div class="content-frame" id="contentFrame">
                <div class="iframe-placeholder">
                    <i class="fas fa-globe"></i>
                    <h3>Start Browsing</h3>
                    <p>Enter a URL or search query to begin</p>
                    <br>
                    <p style="font-size: 14px;">
                        <strong>💡 Tip:</strong> Enable Proxy Mode for sites that block embedding (like Google Login)
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- History Panel -->
    <div class="overlay" id="overlay" onclick="toggleHistory()"></div>
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <h3><i class="fas fa-history"></i> Browsing History</h3>
            <button class="nav-btn" onclick="toggleHistory()" style="background: rgba(255,255,255,0.2);">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="history-list" id="historyList">
            <!-- History items will be loaded here -->
        </div>
    </div>

    <script>
        // State management
        const state = {
            tabs: [{ id: 1, title: 'New Tab', url: '' }],
            activeTab: 1,
            history: [],
            bookmarks: [],
            searchEngines: {
                google: 'https://www.google.com/search?q=',
                bing: 'https://www.bing.com/search?q=',
                youtube: 'https://www.youtube.com/results?search_query=',
                github: 'https://github.com/search?q=',
                stackoverflow: 'https://stackoverflow.com/search?q='
            },
            proxyMode: false
        };

        // Proxy services for bypassing CORS and X-Frame-Options
        const proxyServices = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
            'https://thingproxy.freeboard.io/fetch/'
        ];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            loadHistory();
            loadBookmarks();
            loadUserEmail();
            loadProxyMode();
            // Auto-load default URL
            setTimeout(() => {
                loadFromInput();
            }, 500);
        });

        // Proxy mode toggle
        function toggleProxyMode() {
            state.proxyMode = !state.proxyMode;
            localStorage.setItem('proxyMode', state.proxyMode);
            updateProxyButton();
            
            // Reload current page if exists
            const urlInput = document.getElementById('urlInput');
            if (urlInput && urlInput.value) {
                loadFromInput();
            }
            
            alert(`Proxy Mode ${state.proxyMode ? 'ENABLED' : 'DISABLED'}\n\n` +
                  `Proxy mode uses external services to bypass CORS and X-Frame-Options restrictions.\n` +
                  `Enable this for sites like Google Login that block embedding.`);
        }

        function loadProxyMode() {
            const saved = localStorage.getItem('proxyMode');
            state.proxyMode = saved === 'true';
            updateProxyButton();
        }

        function updateProxyButton() {
            const btn = document.getElementById('proxyBtn');
            const status = document.getElementById('proxyStatus');
            if (state.proxyMode) {
                btn.classList.add('active');
                status.textContent = 'Proxy: ON';
            } else {
                btn.classList.remove('active');
                status.textContent = 'Proxy: OFF';
            }
        }

        // User email management
        function setUserEmail() {
            const currentEmail = localStorage.getItem('userEmail') || 'logreg197@gmail.com';
            const newEmail = prompt('Masukkan email user:', currentEmail);

            if (newEmail && newEmail.trim()) {
                localStorage.setItem('userEmail', newEmail.trim());
                alert('Email user berhasil diubah menjadi: ' + newEmail.trim());
                console.log('User email updated:', newEmail.trim());
            }
        }

        function loadUserEmail() {
            const email = localStorage.getItem('userEmail') || 'logreg197@gmail.com';
            console.log('Logged in as:', email);
            console.log('%c========================================', 'color: #2563eb; font-size: 16px; font-weight: bold;');
            console.log('%c👤 User: ' + email, 'color: #10b981; font-size: 14px; font-weight: bold;');
            console.log('%c🌐 Browser siap digunakan!', 'color: #667eea; font-size: 14px;');
            console.log('%c========================================', 'color: #2563eb; font-size: 16px; font-weight: bold;');
        }

        // Storage functions
        function loadFromStorage() {
            const savedHistory = localStorage.getItem('browserHistory');
            const savedBookmarks = localStorage.getItem('browserBookmarks');

            if (savedHistory) {
                state.history = JSON.parse(savedHistory);
            }

            if (savedBookmarks) {
                state.bookmarks = JSON.parse(savedBookmarks);
            }
        }

        function saveToStorage() {
            localStorage.setItem('browserHistory', JSON.stringify(state.history));
            localStorage.setItem('browserBookmarks', JSON.stringify(state.bookmarks));
        }

        // Search functionality
        let searchDebounceTimer;

        function showSearchSuggestions() {
            clearTimeout(searchDebounceTimer);
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            const suggestionsDiv = document.getElementById('searchSuggestions');

            if (!query) {
                suggestionsDiv.classList.remove('active');
                return;
            }

            searchDebounceTimer = setTimeout(() => {
                const engine = document.getElementById('searchEngine').value;
                const suggestions = generateSuggestions(query, engine);

                if (suggestions.length > 0) {
                    suggestionsDiv.innerHTML = suggestions.map(s => `
                        <div class="suggestion-item" onclick="selectSuggestion('${s.text.replace(/'/g, "\\'")}')">
                            <i class="fas ${s.icon}"></i>
                            <span>${s.text}</span>
                        </div>
                    `).join('');
                    suggestionsDiv.classList.add('active');
                } else {
                    suggestionsDiv.classList.remove('active');
                }
            }, 300);
        }

        function generateSuggestions(query, engine) {
            const suggestions = [];

            suggestions.push({
                text: `Search "${query}" on ${engine.charAt(0).toUpperCase() + engine.slice(1)}`,
                icon: 'fa-search',
                type: 'search'
            });

            if (query.includes('.') && !query.includes(' ')) {
                suggestions.push({
                    text: `Visit ${query}`,
                    icon: 'fa-link',
                    type: 'url'
                });
            }

            const commonSuggestions = [
                `${query} tutorial`,
                `${query} documentation`,
                `${query} examples`
            ];

            commonSuggestions.slice(0, 3).forEach(s => {
                suggestions.push({
                    text: s,
                    icon: 'fa-lightbulb',
                    type: 'suggestion'
                });
            });

            return suggestions;
        }

        function selectSuggestion(text) {
            document.getElementById('searchInput').value = text;
            document.getElementById('searchSuggestions').classList.remove('active');
            performSearch();
        }

        function handleSearchKeyPress(e) {
            if (e.key === 'Enter') {
                performSearch();
                document.getElementById('searchSuggestions').classList.remove('active');
            }
        }

        function performSearch() {
            const input = document.getElementById('searchInput');
            const engine = document.getElementById('searchEngine').value;
            let query = input.value.trim();

            if (!query) return;

            if (isURL(query)) {
                if (!query.startsWith('http://') && !query.startsWith('https://')) {
                    query = 'https://' + query;
                }
                loadURL(query);
            } else {
                const searchUrl = state.searchEngines[engine] + encodeURIComponent(query);
                loadURL(searchUrl);
            }

            addToHistoryDirect(query);
        }

        function isURL(str) {
            const urlPattern = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
            return urlPattern.test(str);
        }

        // Navigation functions with proxy support
        function loadURL(url) {
            const contentFrame = document.getElementById('contentFrame');
            const urlInput = document.getElementById('urlInput');
            
            if (urlInput) {
                urlInput.value = url;
            }

            const domain = extractDomain(url);
            
            // Sites known to block embedding - use proxy automatically
            const blockedSites = ['google.com', 'accounts.google.com', 'facebook.com', 'twitter.com', 'instagram.com', 'linkedin.com'];
            const shouldUseProxy = state.proxyMode || blockedSites.some(site => domain.includes(site));
            
            if (shouldUseProxy) {
                // Use proxy service to bypass restrictions
                const proxyUrl = proxyServices[0] + encodeURIComponent(url);
                contentFrame.innerHTML = `<iframe src="${proxyUrl}" 
                    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"
                    allow="geolocation; microphone; camera; fullscreen; payment; clipboard-write; autoplay"
                    style="width: 100%; height: 100%; border: none;"
                    id="mainFrame"></iframe>`;
                
                console.log('Loading via proxy:', proxyUrl);
            } else {
                // Direct load for compatible sites
                contentFrame.innerHTML = `<iframe src="${url}" 
                    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-top-navigation-by-user-activation"
                    allow="geolocation; microphone; camera; fullscreen; payment; clipboard-write; autoplay"
                    style="width: 100%; height: 100%; border: none;"
                    id="mainFrame"></iframe>`;
            }

            const iframe = document.getElementById('mainFrame');
            if (iframe) {
                iframe.onload = function() {
                    console.log('Page loaded:', url);
                    updateTabTitle(url);
                };
                iframe.onerror = function() {
                    console.error('Failed to load:', url);
                    showFallbackMessage(url, shouldUseProxy);
                };
            }

            updateTabTitle(url);
            addToHistoryDirect(url);
        }

        function showFallbackMessage(url, wasProxy) {
            const contentFrame = document.getElementById('contentFrame');
            const domain = extractDomain(url);
            
            contentFrame.innerHTML = `
                <div class="iframe-placeholder">
                    <i class="fas fa-exclamation-triangle" style="color: var(--warning-color);"></i>
                    <h3>Cannot Embed This Site</h3>
                    <p>The website <strong>${domain}</strong> does not allow embedding in an iframe.</p>
                    <br>
                    ${!wasProxy ? `<button class="btn btn-primary" onclick="enableProxyAndLoad('${url}')" style="margin-bottom: 10px;">
                        <i class="fas fa-shield-alt"></i> Try with Proxy Mode
                    </button><br>` : ''}
                    <button class="btn btn-success" onclick="window.open('${url}', '_blank')">
                        <i class="fas fa-external-link-alt"></i> Open in New Tab
                    </button>
                    <br><br>
                    <p style="font-size: 12px; color: var(--text-secondary);">
                        This is a security restriction set by the website itself.<br>
                        ${!wasProxy ? 'Try enabling Proxy Mode or use the direct link above.' : 'Use the direct link above to access the site.'}
                    </p>
                </div>
            `;
        }

        function enableProxyAndLoad(url) {
            state.proxyMode = true;
            localStorage.setItem('proxyMode', 'true');
            updateProxyButton();
            loadURL(url);
        }

        function extractDomain(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.hostname;
            } catch (e) {
                return url;
            }
        }

        function loadFromInput() {
            const urlInput = document.getElementById('urlInput');
            let url = urlInput.value.trim();
            
            if (!url) return;
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            loadURL(url);
        }

        function addToHistoryDirect(url) {
            const historyItem = {
                id: Date.now(),
                query: url,
                engine: 'direct',
                url: url,
                timestamp: new Date().toISOString()
            };

            state.history.unshift(historyItem);
            
            if (state.history.length > 100) {
                state.history = state.history.slice(0, 100);
            }

            saveToStorage();
            loadHistory();
        }

        function goBack() {
            console.log('Going back...');
            alert('Back navigation (implement browser history)');
        }

        function goForward() {
            console.log('Going forward...');
            alert('Forward navigation (implement browser history)');
        }

        function refreshPage() {
            const urlInput = document.getElementById('urlInput');
            const currentUrl = urlInput ? urlInput.value : '';
            if (currentUrl) {
                loadURL(currentUrl);
            }
        }

        function goHome() {
            document.getElementById('searchInput').value = '';
            const urlInput = document.getElementById('urlInput');
            if (urlInput) {
                urlInput.value = 'https://coder.qwen.ai';
            }
            document.getElementById('contentFrame').innerHTML = `
                <div class="iframe-placeholder">
                    <i class="fas fa-globe"></i>
                    <h3>Start Browsing</h3>
                    <p>Enter a URL or search query to begin</p>
                </div>
            `;
        }

        // Tab management
        function openNewTab() {
            const newId = Date.now();
            state.tabs.push({
                id: newId,
                title: 'New Tab',
                url: ''
            });
            renderTabs();
            state.activeTab = newId;
            goHome();
        }

        function closeTab(event, tabId) {
            event.stopPropagation();

            if (state.tabs.length === 1) {
                alert('Cannot close the last tab');
                return;
            }

            state.tabs = state.tabs.filter(t => t.id !== tabId);

            if (state.activeTab === tabId) {
                state.activeTab = state.tabs[0].id;
            }

            renderTabs();
        }

        function renderTabs() {
            const tabsContainer = document.querySelector('.tabs-container');
            const newTabBtn = tabsContainer.querySelector('.new-tab-btn');

            tabsContainer.innerHTML = state.tabs.map(tab => `
                <div class="tab ${tab.id === state.activeTab ? 'active' : ''}"
                     data-id="${tab.id}"
                     onclick="switchTab(${tab.id})">
                    <span class="tab-title">${escapeHtml(tab.title)}</span>
                    <span class="tab-close" onclick="closeTab(event, ${tab.id})">&times;</span>
                </div>
            `).join('') + newTabBtn.outerHTML;
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            renderTabs();
            const tab = state.tabs.find(t => t.id === tabId);
            if (tab) {
                const urlInput = document.getElementById('urlInput');
                if (urlInput) {
                    urlInput.value = tab.url || 'https://coder.qwen.ai';
                }
                document.getElementById('searchInput').value = '';
            }
        }

        function updateTabTitle(title) {
            const tab = state.tabs.find(t => t.id === state.activeTab);
            if (tab) {
                tab.title = title.substring(0, 30) + (title.length > 30 ? '...' : '');
                tab.url = title;
                renderTabs();
            }
        }

        // History management
        function loadHistory() {
            const historyList = document.getElementById('historyList');

            if (state.history.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 40px;">No browsing history yet</p>';
                return;
            }

            historyList.innerHTML = state.history.map(item => `
                <div class="history-item" onclick="loadURL('${item.url}')">
                    <h4>${escapeHtml(item.query)}</h4>
                    <p>${item.engine} • ${formatDate(item.timestamp)}</p>
                </div>
            `).join('');
        }

        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            const overlay = document.getElementById('overlay');
            panel.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Bookmarks management
        function loadBookmarks() {
            const bookmarksBar = document.getElementById('bookmarksBar');

            if (state.bookmarks.length === 0) return;

            const defaultBookmarks = bookmarksBar.innerHTML;
            const customBookmarks = state.bookmarks.map(b => `
                <div class="bookmark-item" onclick="loadURL('${b.url}')">
                    <i class="fas fa-bookmark"></i> ${escapeHtml(b.title)}
                </div>
            `).join('');

            const addBookmarkBtn = bookmarksBar.lastElementChild;
            bookmarksBar.innerHTML = defaultBookmarks.replace(addBookmarkBtn.outerHTML, '') +
                                    customBookmarks +
                                    addBookmarkBtn.outerHTML;
        }

        function addBookmark() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput ? urlInput.value : '';

            if (!url || url === '') {
                alert('Please navigate to a page first');
                return;
            }

            const title = prompt('Enter bookmark title:', url);

            if (title) {
                state.bookmarks.push({
                    id: Date.now(),
                    title: title,
                    url: url
                });

                saveToStorage();
                loadBookmarks();
                alert('Bookmark added!');
            }
        }

        // Utility functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)} minutes ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)} hours ago`;

            return date.toLocaleDateString();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchSuggestions').classList.remove('active');
            }
        });
    </script>
</body>
</html>
