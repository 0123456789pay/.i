<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Hub - Direktori HTML Terkategorisasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            min-height: 100vh;
            padding-top: 60px;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            box-shadow: 0 2px 8px rgba(33, 150, 243, 0.15);
            z-index: 10000;
            display: flex;
            align-items: center;
            padding: 0 15px;
            overflow: visible;
        }

        /* Brand */
        .brand {
            font-size: 24px;
            font-weight: 800;
            color: #1976d2;
            text-decoration: none;
            margin-right: 20px;
            letter-spacing: -0.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .brand:hover {
            color: #1565c0;
        }

        /* Nav Menu */
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 1px;
            margin: 0;
            padding: 0;
            flex-wrap: nowrap;
            overflow-x: auto;
            flex: 1;
        }

        .nav-item {
            position: relative;
            flex-shrink: 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 7px 10px;
            color: #333;
            text-decoration: none;
            font-weight: 600;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-link:hover {
            background: #e3f2fd;
            color: #1976d2;
        }

        .nav-link.active {
            background: #1976d2;
            color: white;
        }

        .nav-link .arrow {
            font-size: 9px;
            transition: transform 0.2s;
        }

        .nav-link:hover .arrow,
        .nav-link.active .arrow {
            transform: rotate(180deg);
        }

        /* Dropdown */
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(33, 150, 243, 0.25);
            border: 1px solid #e3f2fd;
            min-width: 260px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            z-index: 9999;
            padding: 0;
            pointer-events: none;
        }

        .nav-item:hover .dropdown,
        .nav-item.active .dropdown {
            max-height: 80vh;
            opacity: 1;
            transform: translateY(0);
            overflow-y: auto;
            overflow-x: visible;
            pointer-events: auto;
        }

        .dropdown-header {
            padding: 12px 18px;
            background: linear-gradient(135deg, #1976d2 0%, #2196f3 100%);
            color: white;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px 8px 0 0;
        }

        .dropdown-content {
            padding: 8px 0;
        }

        /* Folder Group in Dropdown */
        .folder-group-dropdown {
            margin-bottom: 4px;
        }

        .folder-title-dropdown {
            padding: 8px 18px 6px;
            font-size: 10px;
            font-weight: 700;
            color: #90a4ae;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .file-item-dropdown {
            padding: 8px 18px 8px 28px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            color: #546e7a;
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
        }

        .file-item-dropdown:hover {
            background: #e3f2fd;
            color: #1976d2;
        }

        .file-item-dropdown.active {
            background: #bbdefb;
            color: #1976d2;
            font-weight: 600;
        }

        .file-icon {
            font-size: 14px;
        }

        /* Main Content */
        .main-content {
            background: #fff;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 70px);
            margin-top: 70px;
        }

        .preview-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .preview-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .preview-path {
            font-size: 12px;
            color: #999;
            font-family: monospace;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1976d2 0%, #2196f3 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .preview-container {
            flex: 1;
            position: relative;
            background: #f8f9fa;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #666;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            font-size: 13px;
            color: #666;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-item strong {
            color: #1976d2;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 40vh;
            }

            .main-content {
                height: 60vh;
            }
        }

        /* Scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #1976d2;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link rel="stylesheet" href="digital/digital-system.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="#" class="brand">.digital</a>
        <ul class="nav-menu" id="nav-menu">
            <!-- Nav items will be rendered here by JavaScript -->
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="preview-header">
            <div class="preview-info">
                <div class="preview-title" id="preview-title">Pilih file untuk melihat preview</div>
                <div class="preview-path" id="preview-path"></div>
            </div>
            <div class="preview-actions">
                <a href="#" class="btn btn-primary" id="open-new-tab" target="_blank" style="display: none;">🚀 Buka Tab Baru</a>
                <button class="btn btn-secondary" onclick="refreshPreview()">🔄 Refresh</button>
            </div>
        </div>

        <div class="preview-container">
            <iframe id="preview-frame" class="preview-frame" src="about:blank"></iframe>
            <div class="empty-state" id="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <h3>Belum ada file yang dipilih</h3>
                <p>Klik pada nama file di menu untuk melihat tampilannya</p>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">📊 Total File: <strong id="stat-total">0</strong></div>
            <div class="stat-item">📁 Kategori: <strong id="stat-categories">0</strong></div>
            <div class="stat-item">👁️ File Aktif: <strong id="stat-active">-</strong></div>
        </div>
    </div>

    <script>
        let fileData = null;
        let currentFile = null;

        // Load categorized data
        async function loadData() {
            try {
                const response = await fetch('file-categories.json');
                if (response.ok) {
                    fileData = await response.json();
                    renderCategories();
                    updateStats();
                    
                    // Check for hash in URL
                    const hash = decodeURIComponent(window.location.hash.substring(1));
                    if (hash) {
                        setTimeout(() => loadFileByPath(hash), 500);
                    }
                } else {
                    throw new Error('Gagal memuat file-categories.json');
                }
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('category-list').innerHTML = `
                    <div style="padding: 20px; color: #dc3545; text-align: center;">
                        ❌ Gagal memuat data kategori.<br>
                        Pastikan file file-categories.json ada di direktori yang sama.
                    </div>
                `;
            }
        }

        function renderNavMenu() {
            const container = document.getElementById('nav-menu');
            container.innerHTML = '';

            for (const [categoryName, categoryData] of Object.entries(fileData.categories)) {
                const navItem = document.createElement('li');
                navItem.className = 'nav-item';
                
                const safeCategoryName = categoryName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const categoryId = categoryName.replace(/\s+/g, '-').replace(/&/g, '-and-');
                
                navItem.innerHTML = `
                    <a href="#" class="nav-link" onclick="toggleNav(event, '${safeCategoryName}')">
                        ${categoryName}
                        <span class="arrow">▼</span>
                    </a>
                    <div class="dropdown" id="dropdown-${categoryId}">
                        <div class="dropdown-header">${categoryData.icon} ${categoryName}</div>
                        <div class="dropdown-content">
                            ${renderDropdownFolders(categoryData.folders)}
                        </div>
                    </div>
                `;
                container.appendChild(navItem);
            }
        }

        function renderDropdownFolders(folders) {
            let html = '';

            for (const [folderName, files] of Object.entries(folders)) {
                if (files.length === 0) continue;

                if (folderName) {
                    const folderDisplayName = folderName.split('/').pop();
                    html += `
                        <div class="folder-group-dropdown">
                            <div class="folder-title-dropdown">
                                📂 ${folderDisplayName}
                            </div>
                    `;
                } else {
                    html += '<div class="folder-group-dropdown">';
                }

                files.forEach(file => {
                    const safePath = file.path.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const safeName = file.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += `
                        <a href="#" class="file-item-dropdown" onclick="loadFile('${safePath}', '${safeName}'); return false;">
                            <span class="file-icon">📄</span>
                            <span>${file.name}</span>
                        </a>
                    `;
                });

                html += '</div>';
            }

            return html;
        }

        function toggleNav(event, categoryName) {
            event.preventDefault();
            const navItem = event.currentTarget.parentElement;
            const isActive = navItem.classList.contains('active');
            
            // Close all nav items
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            // Open clicked item if it was closed
            if (!isActive) {
                navItem.classList.add('active');
            }
        }

        function renderCategories() {
            // This function is now deprecated but kept for compatibility
            renderNavMenu();
        }

        function loadFile(path, name) {
            // Update active state
            document.querySelectorAll('.file-item-dropdown').forEach(el => el.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            // Load file in iframe
            const frame = document.getElementById('preview-frame');
            const emptyState = document.getElementById('empty-state');
            
            frame.src = path;
            emptyState.style.display = 'none';
            
            // Update title and path
            document.getElementById('preview-title').textContent = `📄 ${name}`;
            document.getElementById('preview-path').textContent = path;
            
            // Update open in new tab button
            const openBtn = document.getElementById('open-new-tab');
            openBtn.href = path;
            openBtn.style.display = 'inline-block';

            currentFile = { path, name };
            document.getElementById('stat-active').textContent = name;

            // Update URL hash
            history.pushState(null, null, `#${encodeURIComponent(path)}`);
        }

        function loadFileByPath(path) {
            // Find the file item with matching path
            const fileItems = document.querySelectorAll('.file-item-dropdown');
            for (const item of fileItems) {
                const onclick = item.getAttribute('onclick');
                if (onclick && onclick.includes(`'${path}'`)) {
                    item.click();
                    // Expand the parent dropdown
                    const navItem = item.closest('.nav-item');
                    if (navItem) {
                        navItem.classList.add('active');
                    }
                    break;
                }
            }
        }

        function refreshPreview() {
            if (currentFile) {
                const frame = document.getElementById('preview-frame');
                frame.src = frame.src;
            }
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = fileData.total_files;
            document.getElementById('stat-categories').textContent = Object.keys(fileData.categories).length;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Close dropdowns on ESC
            if (e.key === 'Escape') {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            }
        });

        // Initialize on page load
        window.addEventListener('load', loadData);
    </script>
    <script src="digital/digital-system.js"></script>
</body>
</html>
