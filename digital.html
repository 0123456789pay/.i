<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Hub - Direktori HTML Terkategorisasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 380px;
            background: #fff;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .sidebar-header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .search-box {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 85px;
            z-index: 9;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .category-list {
            padding: 10px;
        }

        .category-item {
            margin-bottom: 10px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: #333;
            border: 1px solid transparent;
        }

        .category-header:hover {
            background: #e9ecef;
            border-color: #dee2e6;
        }

        .category-header.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .category-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-icon {
            font-size: 18px;
        }

        .category-count {
            background: rgba(0,0,0,0.1);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: normal;
        }

        .category-header.active .category-count {
            background: rgba(255,255,255,0.2);
        }

        .file-list {
            display: none;
            padding: 8px 0;
        }

        .file-list.show {
            display: block;
        }

        .folder-group {
            margin-bottom: 12px;
        }

        .folder-title {
            padding: 8px 15px 8px 25px;
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .file-item {
            padding: 10px 15px 10px 35px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 13px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-item:hover {
            background: #f0f4ff;
            border-left-color: #667eea;
            color: #667eea;
        }

        .file-item.active {
            background: #e8eeff;
            border-left-color: #667eea;
            color: #667eea;
            font-weight: 500;
        }

        .file-icon {
            font-size: 14px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .preview-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .preview-path {
            font-size: 12px;
            color: #999;
            font-family: monospace;
        }

        .preview-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .preview-container {
            flex: 1;
            position: relative;
            background: #f8f9fa;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #666;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            font-size: 13px;
            color: #666;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-item strong {
            color: #667eea;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 40vh;
            }

            .main-content {
                height: 60vh;
            }
        }

        /* Scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>📁 Digital Hub</h1>
                <p id="total-files">Memuat daftar file...</p>
            </div>
            
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Cari file HTML... (tekan / untuk fokus)">
            </div>

            <div class="category-list" id="category-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Memuat kategori...</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="preview-header">
                <div class="preview-info">
                    <div class="preview-title" id="preview-title">Pilih file untuk melihat preview</div>
                    <div class="preview-path" id="preview-path"></div>
                </div>
                <div class="preview-actions">
                    <a href="#" class="btn btn-primary" id="open-new-tab" target="_blank" style="display: none;">🚀 Buka Tab Baru</a>
                    <button class="btn btn-secondary" onclick="refreshPreview()">🔄 Refresh</button>
                </div>
            </div>

            <div class="preview-container">
                <iframe id="preview-frame" class="preview-frame" src="about:blank"></iframe>
                <div class="empty-state" id="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <h3>Belum ada file yang dipilih</h3>
                    <p>Klik pada nama file di sidebar untuk melihat tampilannya</p>
                </div>
            </div>

            <div class="stats-bar">
                <div class="stat-item">📊 Total File: <strong id="stat-total">0</strong></div>
                <div class="stat-item">📁 Kategori: <strong id="stat-categories">0</strong></div>
                <div class="stat-item">👁️ File Aktif: <strong id="stat-active">-</strong></div>
            </div>
        </div>
    </div>

    <script>
        let fileData = null;
        let currentFile = null;

        // Load categorized data
        async function loadData() {
            try {
                const response = await fetch('file-categories.json');
                if (response.ok) {
                    fileData = await response.json();
                    renderCategories();
                    updateStats();
                    
                    // Check for hash in URL
                    const hash = decodeURIComponent(window.location.hash.substring(1));
                    if (hash) {
                        setTimeout(() => loadFileByPath(hash), 500);
                    }
                } else {
                    throw new Error('Gagal memuat file-categories.json');
                }
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('category-list').innerHTML = `
                    <div style="padding: 20px; color: #dc3545; text-align: center;">
                        ❌ Gagal memuat data kategori.<br>
                        Pastikan file file-categories.json ada di direktori yang sama.
                    </div>
                `;
            }
        }

        function renderCategories() {
            const container = document.getElementById('category-list');
            container.innerHTML = '';

            for (const [categoryName, categoryData] of Object.entries(fileData.categories)) {
                const categoryEl = document.createElement('div');
                categoryEl.className = 'category-item';
                
                const safeCategoryName = categoryName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                categoryEl.innerHTML = `
                    <div class="category-header" onclick="toggleCategory('${safeCategoryName}')">
                        <div class="category-info">
                            <span class="category-icon">${categoryData.icon}</span>
                            <span>${categoryName}</span>
                        </div>
                        <span class="category-count">${categoryData.total} file</span>
                    </div>
                    <div class="file-list" id="cat-${categoryName.replace(/\s+/g, '-').replace(/&/g, '-and-')}">
                        ${renderFolders(categoryData.folders)}
                    </div>
                `;
                container.appendChild(categoryEl);
            }

            document.getElementById('total-files').textContent = `${fileData.total_files} file HTML ditemukan`;
        }

        function renderFolders(folders) {
            let html = '';

            for (const [folderName, files] of Object.entries(folders)) {
                if (files.length === 0) continue;

                // Show folder name if it's not empty (not root)
                if (folderName) {
                    const folderDisplayName = folderName.split('/').pop();
                    html += `
                        <div class="folder-group">
                            <div class="folder-title">
                                📂 ${folderDisplayName}
                            </div>
                    `;
                } else {
                    html += '<div class="folder-group">';
                }

                files.forEach(file => {
                    const safePath = file.path.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const safeName = file.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += `
                        <div class="file-item" onclick="loadFile('${safePath}', '${safeName}')">
                            <span class="file-icon">📄</span>
                            <span>${file.name}</span>
                        </div>
                    `;
                });

                html += '</div>';
            }

            return html;
        }

        function toggleCategory(categoryName) {
            const header = event.currentTarget;
            const categoryId = categoryName.replace(/\s+/g, '-').replace(/&/g, '-and-');
            const fileList = document.getElementById(`cat-${categoryId}`);
            const isShowing = fileList.classList.contains('show');

            // Close all categories
            document.querySelectorAll('.file-list').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));

            // Open clicked category if it was closed
            if (!isShowing) {
                fileList.classList.add('show');
                header.classList.add('active');
            }
        }

        function loadFile(path, name) {
            // Update active state
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Load file in iframe
            const frame = document.getElementById('preview-frame');
            const emptyState = document.getElementById('empty-state');
            
            frame.src = path;
            emptyState.style.display = 'none';
            
            // Update title and path
            document.getElementById('preview-title').textContent = `📄 ${name}`;
            document.getElementById('preview-path').textContent = path;
            
            // Update open in new tab button
            const openBtn = document.getElementById('open-new-tab');
            openBtn.href = path;
            openBtn.style.display = 'inline-block';

            currentFile = { path, name };
            document.getElementById('stat-active').textContent = name;

            // Update URL hash
            history.pushState(null, null, `#${encodeURIComponent(path)}`);
        }

        function loadFileByPath(path) {
            // Find the file item with matching path
            const fileItems = document.querySelectorAll('.file-item');
            for (const item of fileItems) {
                const onclick = item.getAttribute('onclick');
                if (onclick && onclick.includes(`'${path}'`)) {
                    item.click();
                    // Expand the parent category
                    const categoryItem = item.closest('.category-item');
                    if (categoryItem) {
                        const header = categoryItem.querySelector('.category-header');
                        const fileList = categoryItem.querySelector('.file-list');
                        if (header && fileList) {
                            fileList.classList.add('show');
                            header.classList.add('active');
                        }
                    }
                    break;
                }
            }
        }

        function refreshPreview() {
            if (currentFile) {
                const frame = document.getElementById('preview-frame');
                frame.src = frame.src;
            }
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = fileData.total_files;
            document.getElementById('stat-categories').textContent = Object.keys(fileData.categories).length;
        }

        // Search functionality
        document.getElementById('search-input').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            
            document.querySelectorAll('.file-item').forEach(item => {
                const text = item.textContent.toLowerCase();
                if (text.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });

            // Auto-expand categories with results
            if (query) {
                document.querySelectorAll('.category-item').forEach(cat => {
                    const visibleFiles = cat.querySelectorAll('.file-item[style="display: flex"], .file-item:not([style*="display"])');
                    const hasVisible = Array.from(visibleFiles).some(f => f.style.display !== 'none');
                    if (hasVisible) {
                        cat.querySelector('.file-list').classList.add('show');
                        cat.querySelector('.category-header').classList.add('active');
                    }
                });
            } else {
                // Reset when search is cleared
                document.querySelectorAll('.file-list').forEach(el => el.classList.remove('show'));
                document.querySelectorAll('.category-header').forEach(el => el.classList.remove('active'));
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Focus search on / key
            if (e.key === '/' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
            
            // ESC to clear search
            if (e.key === 'Escape' && e.target.id === 'search-input') {
                e.target.value = '';
                e.target.dispatchEvent(new Event('input'));
                e.target.blur();
            }
        });

        // Initialize on page load
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
