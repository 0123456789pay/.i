<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aireber Digital</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">🎨 Aireber Digital</div>
                <h2>Welcome Back</h2>
                <p style="color: var(--gray-700);">Sign in to your AI Studio Dashboard</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" style="color: var(--primary-blue); text-decoration: none; font-size: 14px;">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
            
            <div style="text-align: center; margin-top: 25px; color: var(--gray-700);">
                Don't have an account? 
                <a href="register.html" style="color: var(--primary-blue); text-decoration: none; font-weight: 600;">Create account</a>
            </div>
            
            <div style="margin-top: 30px; padding-top: 30px; border-top: 1px solid var(--gray-200);">
                <p style="text-align: center; color: var(--gray-700); font-size: 14px; margin-bottom: 15px;">Or continue with</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <button class="btn btn-secondary" style="width: 100%;">📘 Google</button>
                    <button class="btn btn-secondary" style="width: 100%;">🐦 Twitter</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="../assets/js/main.js"></script>
</body>
</html>
