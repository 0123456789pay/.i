<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Aireber Digital</title>
    
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-logo">🎨 Aireber Digital</div>
                <h2>Create Account</h2>
                <p style="color: var(--gray-700);">Join our AI Studio Dashboard</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="8" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" minlength="8" required>
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" required> I agree to the <a href="#" style="color: var(--primary-blue); text-decoration: none;">Terms of Service</a> and <a href="#" style="color: var(--primary-blue); text-decoration: none;">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            
            <div style="text-align: center; margin-top: 25px; color: var(--gray-700);">
                Already have an account? 
                <a href="login.html" style="color: var(--primary-blue); text-decoration: none; font-weight: 600;">Sign in</a>
            </div>
        </div>
    </div>

</body>
</html>
