<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Manager - Aireber Digital</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../../index.html" class="sidebar-logo">🎨 Aireber Digital</a>
            </div>
            <ul class="menu">
                <li class="menu-item"><a href="../../index.html" class="menu-link">🏠 Back to Main</a></li>
                <li class="menu-item"><a href="../social.html" class="menu-link">📱 All Platforms</a></li>
                <li class="menu-item"><a href="#" class="menu-link active">📘 Facebook</a></li>
                <li class="menu-item"><a href="instagram.html" class="menu-link">📷 Instagram</a></li>
                <li class="menu-item"><a href="twitter.html" class="menu-link">🐦 Twitter</a></li>
                <li class="menu-item"><a href="linkedin.html" class="menu-link">💼 LinkedIn</a></li>
                <li class="menu-item"><a href="tiktok.html" class="menu-link">🎵 TikTok</a></li>
                <li class="menu-item"><a href="youtube.html" class="menu-link">📺 YouTube</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">📘 Facebook Manager</h1>
                <button class="btn btn-primary">Create Post</button>
            </div>
            
            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Page Likes</h3>
                        <div class="card-icon">👍</div>
                    </div>
                    <div class="card-value" data-animate="847593">0</div>
                    <div class="card-label">Total page likes</div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Post Reach</h3>
                        <div class="card-icon">📢</div>
                    </div>
                    <div class="card-value" data-animate="2456789">0</div>
                    <div class="card-label">Weekly reach</div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Engagement</h3>
                        <div class="card-icon">💬</div>
                    </div>
                    <div class="card-value" data-animate="156432">0</div>
                    <div class="card-label">Total engagements</div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../assets/js/main.js"></script>
</body>
</html>
