<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Editor Kode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 30px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .search-box { width: 100%; max-width: 600px; margin: 0 auto 30px; display: block; }
        .search-box input { width: 100%; padding: 15px 25px; border: none; border-radius: 50px; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); outline: none; }
        .stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: white; padding: 20px 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; }
        .stat-number { font-size: 2em; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .menu-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
        .menu-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .menu-icon { font-size: 2.5em; margin-bottom: 15px; }
        .menu-title { font-size: 1.2em; font-weight: bold; color: #333; margin-bottom: 10px; }
        .menu-desc { color: #666; font-size: 0.9em; line-height: 1.5; }
        .category-filter { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 25px; border: none; border-radius: 25px; background: rgba(255,255,255,0.2); color: white; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .filter-btn:hover, .filter-btn.active { background: white; color: #667eea; }
        .filemanajer-link { position: fixed; bottom: 30px; right: 30px; background: #4CAF50; color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: bold; transition: all 0.3s; }
        .filemanajer-link:hover { background: #45a049; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Dashboard Editor Kode</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Cari menu..." onkeyup="filterMenus()">
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalFiles">0</div>
                <div class="stat-label">Total Menu</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="htmlFiles">0</div>
                <div class="stat-label">HTML Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="cssFiles">0</div>
                <div class="stat-label">CSS Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="jsFiles">0</div>
                <div class="stat-label">JS Files</div>
            </div>
        </div>
        
        <div class="category-filter">
            <button class="filter-btn active" onclick="filterCategory('all')">Semua</button>
            <button class="filter-btn" onclick="filterCategory('file')">File</button>
            <button class="filter-btn" onclick="filterCategory('edit')">Edit</button>
            <button class="filter-btn" onclick="filterCategory('view')">View</button>
            <button class="filter-btn" onclick="filterCategory('tools')">Tools</button>
            <button class="filter-btn" onclick="filterCategory('help')">Help</button>
        </div>
        
        <div class="menu-grid" id="menuGrid"></div>
    </div>
    
    <a href="filemanajer/index.html" class="filemanajer-link">📁 File Manager</a>

            { id: 96, title: "Multi Cursor", desc: "Kursor ganda", icon: "👆👆", category: "edit" },
            { id: 97, title: "Column Select", desc: "Seleksi kolom", icon: "📊", category: "edit" },
            { id: 98, title: "Fold All", desc: "Tutup semua fold", icon: "📁❌", category: "view" },
            { id: 99, title: "Unfold All", desc: "Buka semua fold", icon: "📁✅", category: "view" },
            { id: 100, title: "Quick Open", desc: "Buka cepat", icon: "⚡📂", category: "file" }
        ];
        
        let currentFilter = 'all';
        
        function renderMenus(filter = 'all', searchTerm = '') {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            
            const filtered = menus.filter(menu => {
                const matchesCategory = filter === 'all' || menu.category === filter;
                const matchesSearch = menu.title.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                     menu.desc.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });
            
            filtered.forEach(menu => {
                const card = document.createElement('a');
                card.className = 'menu-card';
                card.href = `menu_${menu.id}.html`;
                card.innerHTML = `
                    <div class="menu-icon">${menu.icon}</div>
                    <div class="menu-title">${menu.title}</div>
                    <div class="menu-desc">${menu.desc}</div>
                `;
                grid.appendChild(card);
            });
            
            updateStats(filtered.length);
        }
        
        function updateStats(visibleCount) {
            document.getElementById('totalFiles').textContent = menus.length;
            document.getElementById('htmlFiles').textContent = menus.filter(m => m.category === 'file').length;
            document.getElementById('cssFiles').textContent = menus.filter(m => m.category === 'view').length;
            document.getElementById('jsFiles').textContent = menus.filter(m => m.category === 'tools').length;
        }
        
        function filterMenus() {
            const searchTerm = document.getElementById('searchInput').value;
            renderMenus(currentFilter, searchTerm);
        }
        
        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenus(category, document.getElementById('searchInput').value);
        }
        
        renderMenus();
    </script>
