<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huruf z - AllUnivers Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary-color: #0077cc;
            --secondary-color: #0099ff;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-bg: #1f2937;
            --light-bg: #f3f4f6;
            --border-color: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .ihsfb-identifier {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            z-index: 10000;
        }
        
        .ihsfb-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-logo {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .ihsfb-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        
        .letter-card {
            background: white;
            border-radius: 20px;
            padding: 60px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.20);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .letter-display {
            font-size: 180px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        
        .letter-info {
            color: var(--text-secondary);
            font-size: 18px;
            line-height: 1.6;
        }
        
        .ihsfb-footer {
            background: var(--dark-bg);
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="ihsfb-identifier"></div>
    
    <header class="ihsfb-header">
        <div class="header-logo">
            <span>AllUnivers - Huruf z</span>
        </div>
    </header>
    
    <div class="ihsfb-body">
        <div class="letter-card">
            <div class="letter-display">z</div>
            <div class="letter-info">
                <p>Ini adalah halaman untuk huruf <strong>z</strong></p>
                <p>Bagian dari sistem AllUnivers IHSFB Container</p>
                <p>Tema: Putih dan Biru Laut</p>
            </div>
        </div>
    </div>
    
    <footer class="ihsfb-footer">
        <p>2024 AllUnivers Dashboard. Dibuat dengan teknologi Indonesia.</p>
    </footer>
</body>
</html>
