<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - BISNISSTARTUP.DIGITAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .page-container { min-height: 100vh; margin-top: 70px; padding: 2rem; }
        .settings-header { background: linear-gradient(135deg, #0047b3 0%, #0066ff 100%); color: white; padding: 2rem; border-radius: 15px; margin-bottom: 2rem; }
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; }
        .settings-card { background: white; border-radius: 15px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.1); }
        .settings-title { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .form-label { font-weight: 600; color: #475569; }
    </style>
</head>
<body>
    <nav class="brand-navbar">
        <div class="container-fluid">
            <a href="../index.html" class="brand-logo"><i class="fas fa-rocket"></i><span>BISNISSTARTUP.DIGITAL</span></a>
            <ul class="nav-links d-flex gap-3 list-unstyled m-0">
                <li><a href="../index.html" class="text-white text-decoration-none">Beranda</a></li>
                <li><a href="../dashboard/index.html" class="text-white text-decoration-none">Dashboard</a></li>
                <li><a href="../konten/index.html" class="text-white text-decoration-none">Konten</a></li>
                <li><a href="index.html" class="text-white text-decoration-none fw-bold">Pengaturan</a></li>
                <li><a href="../bantuan/index.html" class="text-white text-decoration-none">Bantuan</a></li>
            </ul>
        </div>
    </nav>

    <div class="page-container">
        <div class="settings-header">
            <h1><i class="fas fa-cog"></i> Pengaturan Sistem</h1>
            <p class="mb-0">Konfigurasi dan pengaturan platform bisnis startup</p>
        </div>

        <div class="settings-grid">
            <div class="settings-card">
                <h3 class="settings-title"><i class="fas fa-user-circle text-primary"></i> Profil Akun</h3>
                <form>
                    <div class="mb-3"><label class="form-label">Nama Lengkap</label><input type="text" class="form-control" value="Admin"></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" value="admin@bisnisstartup.digital"></div>
                    <button class="btn btn-primary"><i class="fas fa-save"></i> Simpan</button>
                </form>
            </div>
            <div class="settings-card">
                <h3 class="settings-title"><i class="fas fa-lock text-primary"></i> Keamanan</h3>
                <form>
                    <div class="mb-3"><label class="form-label">Password Lama</label><input type="password" class="form-control"></div>
                    <div class="mb-3"><label class="form-label">Password Baru</label><input type="password" class="form-control"></div>
                    <button class="btn btn-primary"><i class="fas fa-key"></i> Ubah Password</button>
                </form>
            </div>
            <div class="settings-card">
                <h3 class="settings-title"><i class="fas fa-bell text-primary"></i> Notifikasi</h3>
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Email Notification</label></div>
                <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Push Notification</label></div>
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox"><label class="form-check-label">SMS Notification</label></div>
            </div>
            <div class="settings-card">
                <h3 class="settings-title"><i class="fas fa-palette text-primary"></i> Tampilan</h3>
                <div class="mb-3"><label class="form-label">Tema</label><select class="form-select"><option>Light</option><option>Dark</option><option>Auto</option></select></div>
                <div class="mb-3"><label class="form-label">Bahasa</label><select class="form-select"><option>Indonesia</option><option>English</option></select></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
